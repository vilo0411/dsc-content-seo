ri": "P1", "group": ["cluster"], "items": [{"pos": "Bò và gấu trong chứng khoán là gì?", "before": "<p>Trong thế giới chứng khoán, bò và gấu là hai thuật ngữ được sử dụng để mô tả hai xu hướng đối nghịch nhau của thị trường. Bò biểu thị cho thị trường tăng giá, trong khi gấu biểu thị cho thị trường giảm giá.<\/p>", "after": "<p>Trong thế giới chứng khoán, bò và gấu là hai thuật ngữ được sử dụng để mô tả hai xu hướng đối nghịch nhau của thị trường. Bò biểu thị cho thị trường tăng giá, trong khi gấu biểu thị cho thị trường giảm giá. Đây là hai khái niệm người mới gặp sớm nhất khi tìm hiểu <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau\">cách chơi chứng khoán<\/a>, vì chúng quyết định nên mua, giữ hay đứng ngoài.<\/p>", "links": [{"to": "cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau", "url": "https://www.dsc.com.vn/kien-thuc/cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "pillar · đoạn i=2"}], "group": ["cluster"], "pri": "P1"}, {"pos": "Chính sách tiền tệ", "before": "<p><a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chinh-sach-tien-te-la-gi\"><strong>Chính sách tiền tệ<\/strong><\/a> của ngân hàng trung ương cũng có thể ảnh hưởng đến xu hướng của thị trường chứng khoán. Khi ngân hàng trung ương hạ lãi suất, chi phí đi vay của các doanh nghiệp và cá nhân giảm xuống, điều này thúc đẩy nhu cầu đầu tư và tiêu dùng, dẫn đến giá cổ phiếu tăng lên. Ngược lại, khi ngân hàng trung ương tăng lãi suất, chi phí đi vay tăng lên, điều này khiến các doanh nghiệp và cá nhân thắt chặt chi tiêu, dẫn đến giá cổ phiếu giảm xuống.<\/p>", "after": "<p><a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chinh-sach-tien-te-la-gi\"><strong>Chính sách tiền tệ<\/strong><\/a> của ngân hàng trung ương cũng có thể ảnh hưởng đến xu hướng của thị trường chứng khoán. Khi ngân hàng trung ương hạ lãi suất, chi phí đi vay của các doanh nghiệp và cá nhân giảm xuống, điều này thúc đẩy nhu cầu đầu tư và tiêu dùng, dẫn đến giá cổ phiếu tăng lên. Ngược lại, khi ngân hàng trung ương tăng lãi suất, chi phí đi vay tăng lên, điều này khiến các doanh nghiệp và cá nhân thắt chặt chi tiêu, dẫn đến giá cổ phiếu giảm xuống. Tác động này lan qua toàn bộ <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/thi-truong-tai-chinh-la-gi\">thị trường tài chính<\/a>, từ tiền gửi, trái phiếu đến cổ phiếu.<\/p>", "links": [{"to": "thi-truong-tai-chinh-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/thi-truong-tai-chinh-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "sub-hub · đoạn i=16"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "stop-loss-la-gi-cach-su-dung-lenh-stop-loss-trong-chung-khoan", "title": "Stop loss là gì? Cách sử dụng lệnh stop loss trong chứng khoán", "url": "https://www.dsc.com.vn/kien-thuc/stop-loss-la-gi-cach-su-dung-lenh-stop-loss-trong-chung-khoan", "clicks": 17, "pri": "P1", "group": ["cluster"], "items": [{"pos": "Stop loss là gì?", "before": "<p>Stop loss là một thuật ngữ phổ biến trong đầu tư chứng khoán, được hiểu là lệnh <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cat-lo-la-gi\"><strong>cắt lỗ<\/strong><\/a>. Khi đặt lệnh stop loss, nhà đầu tư sẽ chỉ định một mức giá mà tại đó lệnh bán sẽ được thực hiện tự động, bất kể giá thị trường đang ở mức nào. Điều này giúp nhà đầu tư hạn chế mức thua lỗ khi thị trường đi ngược với kỳ vọng của họ.<\/p>", "after": "<p>Stop loss là một thuật ngữ phổ biến trong đầu tư chứng khoán, được hiểu là lệnh <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cat-lo-la-gi\"><strong>cắt lỗ<\/strong><\/a>. Khi đặt lệnh stop loss, nhà đầu tư sẽ chỉ định một mức giá mà tại đó lệnh bán sẽ được thực hiện tự động, bất kể giá thị trường đang ở mức nào. Điều này giúp nhà đầu tư hạn chế mức thua lỗ khi thị trường đi ngược với kỳ vọng của họ. Khác với <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/lenh-ato-at n (Put-through Trading) là phương thức giao dịch mà bên mua và bên bán tự thống nhất với nhau về khối lượng, mức giá và phương thức thanh toán trước khi thông báo cho công ty chứng khoán ghi nhận kết quả vào hệ thống giao dịch của Sở Giao dịch Chứng khoán. Phương thức này tách biệt với khớp lệnh trên sàn, nơi nhà đầu tư dùng <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/lenh-ato-atc-lo-mp-la-gi\">các loại lệnh<\/a> như LO, ATO hay ATC để hệ thống tự ghép giá.<\/p>", "links": [{"to": "lenh-ato-atc-lo-mp-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/lenh-ato-atc-lo-mp-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "hub · đoạn i=3"}], "group": ["cluster"], "pri": "P1"}, {"pos": "So sánh giao dịch thỏa thuận và giao dịch khớp lệnh", "before": "<p>Nhìn chung, giao dịch khớp lệnh đem lại tính linh hoạt cao cho các nhu cầu mua bán tức thời. Ngược lại, giao dịch thỏa thuận bảo vệ nhà đầu tư khỏi sự biến động bất lợi về giá khi cần chuyển nhượng lượng lớn cổ phiếu.<\/p>", "after": "<p>Nhìn chung, giao dịch khớp lệnh đem lại tính linh hoạt cao cho các nhu cầu mua bán tức thời. Ngược lại, giao dịch thỏa thuận bảo vệ nhà đầu tư khỏi sự biến động bất lợi về giá khi cần chuyển nhượng lượng lớn cổ phiếu. Người mới học <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau\">cách chơi chứng khoán<\/a> hầu như chỉ dùng khớp lệnh, còn thỏa thuận dành cho các giao dịch khối lượng lớn.<\/p>", "links": [{"to": "cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau", "url": "https://www.dsc.com.vn/kien-thuc/cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "pillar · đoạn i=23"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "cac-chi-so-chung-khoan-viet-nam-hieu-ro-ve-vn-index-vn-30-hnx-index-va-nhieu-chi-so-khac", "title": "Các chỉ số chứng khoán Việt Nam nhà đầu tư cần biết", "url": "https://www.dsc.com.vn/kien-thuc/cac-chi-so-chung-khoan-viet-nam-hieu-ro-ve-vn-index-vn-30-hnx-index-va-nhieu-chi-so-khac", "clicks": 10, "pri": "P1", "group": ["cluster"], "items": [{"pos": "VN-Index", "before": "<p><a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chi-so-vn-index-va-y-nghia-quan-trong-trong-thi-truong-chung-khoan-viet-nam\"><strong>VN-Index<\/strong><\/a> là chỉ số đại diện cho toàn bộ cổ phiếu niêm yết tại Sở Giao dịch Chứng khoán TP. Hồ Chí Minh (HOSE). Được tính toán dựa trên giá và khối lượng giao dịch của các cổ phiếu trên sàn HOSE. VN-Index phản ánh mức độ biến động chung của thị trường chứng khoán Việt Nam. Đây là một trong những chỉ số quan trọng nhất cho nhà đầu tư và người theo dõi thị trường.<\/p>", "after": "<p><a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chi-so-vn-index-va-y-nghia-quan-trong-trong-thi-truong-chung-khoan-viet-nam\"><strong>VN-Index<\/strong><\/a> là chỉ số đại diện cho toàn bộ cổ phiếu niêm yết tại Sở Giao dịch Chứng khoán TP. Hồ Chí Minh (HOSE). Được tính toán dựa trên giá và khối lượng giao dịch của các cổ phiếu trên sàn HOSE. VN-Index phản ánh mức độ biến động chung của thị trường chứng khoán Việt Nam. Đây là một trong những chỉ số quan trọng nhất cho nhà đầu tư và người theo dõi thị trường.<\/p>\n<p>Giống mọi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chi-so-chung-khoan-la-gi\">chỉ số chứng khoán<\/a> khác, VN-Index không cho biết giá của một mã cụ thể mà cho biết mặt bằng giá chung của cả sàn.<\/p>", "links": [{"to": "chi-so-chung-khoan-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/chi-so-chung-khoan-la-gi", "anchor": "", "op": "newp", "group": "cluster", "pri": "P1", "why": "hub · đoạn i=6"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "diem-trong-chung-khoan-la-gi-cach-tinh-va-y-nghia", "title": "Điểm trong chứng khoán là gì? Cách tính và ý nghĩa", "url": "https://www.dsc.com.vn/kien-thuc/diem-trong-chung-khoan-la-gi-cach-tinh-va-y-nghia", "clicks": 10, "pri": "P1", "group": ["cluster"], "items": [{"pos": "Điểm chứng khoán là gì?", "before": "<p>Điểm chứng khoán là một chỉ số thể hiện sự tăng giảm của giá cổ phiếu trên thị trường chứng khoán. Chỉ số này có thể thể hiện tình hình biến động của toàn thị trường hoặc đối với từng chỉ số riêng biệt. Nhà đầu tư có thể dựa vào sự lên xuống của điểm số để xác định xu hướng của thị trường.<\/p>", "after": "<p>Điểm chứng khoán là một chỉ số thể hiện sự tăng giảm của giá cổ phiếu trên thị trường chứng khoán. Chỉ số này có thể thể hiện tình hình biến động của toàn thị trường hoặc đối với từng chỉ số riêng biệt. Nhà đầu tư có thể dựa vào sự lên xuống của điểm số để xác định xu hướng của thị trường. Đọc được điểm số là kỹ năng đầu tiên khi học <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau\">cách chơi chứng khoán<\/a>, trước cả việc chọn mã.<\/p>", "links": [{"to": "cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau", "url": "https://www.dsc.com.vn/kien-thuc/cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "pillar · đoạn i=4"}], "group": ["cluster"], "pri": "P1"}, {"pos": "Ý nghĩa của điểm chứng khoán", "before": "<p>Điểm chứng khoán có ý nghĩa quan trọng trong việc đánh giá xu hướng của thị trường chứng khoán. Nếu điểm chứng khoán tăng, chứng tỏ thị trường đang có xu hướng tăng và những cổ phiếu tăng giá đang chiếm ưu thế. Ngược lại, nếu điểm chứng khoán giảm, chứng tỏ thị trường đang có xu hướng giảm và nhiều nhà đầu tư đang bán tháo cổ phiếu của mình.<\/p>", "after": "<p>Điểm chứng khoán có ý nghĩa quan trọng trong việc đánh giá xu hướng của thị trường chứng khoán. Nếu điểm chứng khoán tăng, chứng tỏ thị trường đang có xu hướng tăng và những cổ phiếu tăng giá đang chiếm ưu thế. Ngược lại, nếu điểm chứng khoán giảm, chứng tỏ thị trường đang có xu hướng giảm và nhiều nhà đầu tư đang bán tháo cổ phiếu của mình. Điểm cũng là một trong những <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-thuat-ngu-trong-chung-khoan\">thuật ngữ chứng khoán<\/a> xuất hiện nhiều nhất trên bản tin thị trường hằng ngày.<\/p>", "links": [{"to": "cac-thuat-ngu-trong-chung-khoan", "url": "https://www.dsc.com.vn/kien-thuc/cac-thuat-ngu-trong-chung-khoan", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "sub-hub · đoạn i=11"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "chi-so-msci-la-gi", "title": "Chỉ số MSCI là gì? Vai trò của chỉ số MSCI", "url": "https://www.dsc.com.vn/kien-thuc/chi-so-msci-la-gi", "clicks": 9, "pri": "P1", "group": ["cluster"], "items": [{"pos": "Chỉ số MSCI là gì?", "before": "<p>Chỉ số MSCI là một chỉ số trọng số vốn hóa thị trường, có nghĩa là giá trị của chỉ số được xác định bởi tổng giá trị vốn hóa thị trường của các cổ phiếu trong chỉ số. Cổ phiếu có vốn hóa thị trường lớn nhất có tỷ trọng cao nhất trong chỉ số.<\/p>", "after": "<p>Chỉ số MSCI là một chỉ số trọng số vốn hóa thị trường, có nghĩa là giá trị của chỉ số được xác định bởi tổng giá trị vốn hóa thị trường của các cổ phiếu trong chỉ số. Cổ phiếu có vốn hóa thị trường lớn nhất có tỷ trọng cao nhất trong chỉ số. Đây cũng là cách tính phổ biến nhất của một <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chi-so-chung-khoan-la-gi\">chỉ số chứng khoán<\/a>, được dùng cho cả VN-Index trên sàn HOSE.<\/p>", "links": [{"to": "chi-so-chung-khoan-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/chi-so-chung-khoan-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "hub · đoạn i=4"}], "group": ["cluster"], "pri": "P1"}, {"pos": "Vai trò của chỉ số MSCI", "before": "<p>Chỉ số MSCI đóng vai trò quan trọng trong thị trường chứng khoán. Nó là một công cụ hữu ích cho các nhà đầu tư để theo dõi hiệu suất của các thị trường chứng khoán khác nhau, cũng như để so sánh hiệu suất của các danh mục đầu tư khác nhau.<\/p>", "after": "<p>Chỉ số MSCI đóng vai trò quan trọng trong thị trường chứng khoán. Nó là một công cụ hữu ích cho các nhà đầu tư để the quan trọng của chỉ số Dow Jones và tác động tới thị trường Việt Nam", "before": "<p>Biến động của chỉ số Dow Jones có sức lan tỏa vĩ mô cực kỳ mạnh mẽ. Đối với giới đầu tư Việt Nam, chỉ số này giống như chiếc la bàn dẫn đường cho dòng vốn liên thị trường.<\/p>", "after": "<p>Biến động của chỉ số Dow Jones có sức lan tỏa vĩ mô cực kỳ mạnh mẽ. Đối với giới đầu tư Việt Nam, chỉ số này giống như chiếc la bàn dẫn đường cho dòng vốn liên thị trường. Tín hiệu từ Dow Jones thường đến Việt Nam qua các <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-chi-so-chung-khoan-chau-a-noi-bat\">chỉ số chứng khoán châu Á<\/a> mở cửa sớm hơn như Nikkei và KOSPI.<\/p>", "links": [{"to": "cac-chi-so-chung-khoan-chau-a-noi-bat", "url": "https://www.dsc.com.vn/kien-thuc/cac-chi-so-chung-khoan-chau-a-noi-bat", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=42"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-so-hnx-30-la-gi", "title": "Chỉ số HNX30 là gì? Ý nghĩa và tiêu chí lựa chọn cổ phiếu", "url": "https://www.dsc.com.vn/kien-thuc/chi-so-hnx-30-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Chỉ số HNX30 là gì?", "before": "<p>Khác với phương pháp tính vốn hóa toàn bộ truyền thống, chỉ số HNX30 chỉ tính toán dựa trên lượng cổ phiếu thực sự tự do giao dịch trên thị trường. Điều này giúp loại bỏ lượng cổ phiếu bị nắm giữ lâu dài bởi cơ quan nhà nước hay cổ đông chiến lược.<\/p>", "after": "<p>Khác với phương pháp tính vốn hóa toàn bộ truyền thống, chỉ số HNX30 chỉ tính toán dựa trên lượng cổ phiếu thực sự tự do giao dịch trên thị trường. Điều này giúp loại bỏ lượng cổ phiếu bị nắm giữ lâu dài bởi cơ quan nhà nước hay cổ đông chiến lược. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-chi-so-chung-khoan-viet-nam-hieu-ro-ve-vn-index-vn-30-hnx-index-va-nhieu-chi-so-khac\">các chỉ số chứng khoán Việt Nam<\/a>, HNX30 giữ vai trò với sàn HNX tương tự VN30 với sàn HOSE.<\/p>", "links":  thường có quy mô lớn, sở hữu nhiều vốn và có mối quan hệ rộng rãi trên thị trường. Người mới học <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau\">cách chơi chứng khoán<\/a> là nhóm dễ bị cuốn theo nhất, vì thường mua theo lời rủ trong hội nhóm.<\/p>", "links": [{"to": "cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau", "url": "https://www.dsc.com.vn/kien-thuc/cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=1"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "gio-giao-dich-chung-khoan-quoc-te", "title": "Giờ giao dịch chứng khoán quốc tế chuẩn giờ Việt Nam 2026", "url": "https://www.dsc.com.vn/kien-thuc/gio-giao-dich-chung-khoan-quoc-te", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Thị trường chứng khoán quốc tế tác động thế nào đến VN-Index?", "before": "<p>Biến động mạnh trên 1,5% của chỉ số Dow Jones rạng sáng thường tạo quán tính tâm lý lên phiên ATO (09:00 - 09:15) trên sàn HOSE. Tuy nhiên, xác suất duy trì cùng chiều đến phiên đóng cửa ATC chỉ đạt dưới 60%. Tâm lý mở phiên thường chỉ kéo dài trong 30 đến 45 phút đầu ngày.<\/p>", "after": "<p>Biến động mạnh trên 1,5% của chỉ số Dow Jones rạng sáng thường tạo quán tính tâm lý lên phiên ATO (09:00 - 09:15) trên sàn HOSE. Tuy nhiên, xác suất duy trì cùng chiều đến phiên đóng cửa ATC chỉ đạt dưới 60%. Tâm lý mở phiên thường chỉ kéo dài trong 30 đến 45 phút đầu ngày. Vì vậy, người đặt <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/lenh-ato-atc-lo-mp-la-gi\">lệnh ATO<\/a> sau một đêm chứng khoán Mỹ biến động mạnh cần tính tới khả năng giá đảo chiều trong phiên.<\/p>", "links": [{"to": "lenh-ato-atc-lo-mp-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/lenh-ato-atc-lo-mp-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=51"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "krx-la-gi", "title": "H an-cho-nguoi-moi-bat-dau\">cách chơi chứng khoán<\/a> nên thành thạo lệnh LO trước, vì lệnh thị trường như MAK không cho chọn giá khớp.<\/p>", "links": [{"to": "cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau", "url": "https://www.dsc.com.vn/kien-thuc/cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=2"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "lenh-plo-la-gi", "title": "Lệnh PLO là gì? Quy định và cách giao dịch lệnh PLO sàn HNX", "url": "https://www.dsc.com.vn/kien-thuc/lenh-plo-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "So sánh lệnh PLO với các loại lệnh giao dịch phổ biến", "before": "<p>Sự khác biệt lớn nhất của lệnh PLO là tính xác định về giá giao dịch. Nhà đầu tư không cần tính toán giá khớp như khi đặt lệnh ATC hay LO.<\/p>", "after": "<p>Sự khác biệt lớn nhất của lệnh PLO là tính xác định về giá giao dịch. Nhà đầu tư không cần tính toán giá khớp như khi đặt lệnh ATC hay LO. Với người mới tìm hiểu <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau\">cách chơi chứng khoán<\/a>, đây là loại lệnh dễ dùng nhất vì chỉ cần nhập khối lượng.<\/p>", "links": [{"to": "cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau", "url": "https://www.dsc.com.vn/kien-thuc/cach-dau-tu-chung-khoan-cho-nguoi-moi-bat-dau", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=31"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "repo-chung-khoan-la-gi", "title": "Repo chứng khoán là gì? Thông tin chi tiết từ A - Z", "url": "https://www.dsc.com.vn/kien-thuc/repo-chung-khoan-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Repo chứng khoán là gì?", "before": "<p><strong>Repo chứng khoán<\/strong> (tên đầy đủ là <a target=\"_blank\" href=\"https://en.wikipedia.org/wiki/Repurchase_agreement\" rel=\"nofollow\"><i><strong>Repurchase Agreement<\/strong><\/i>< , {"slug": "vn-diamond-la-gi", "title": "VN Diamond là gì? Khám phá rổ cổ phiếu kim cương và ETF", "url": "https://www.dsc.com.vn/kien-thuc/vn-diamond-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Bản chất chỉ số VN Diamond là gì?", "before": "<p>Chỉ số VN Diamond (Vietnam Diamond Index) là bộ chỉ số cổ phiếu kim cương của sàn HOSE, được vận hành chính thức từ tháng 11/2019. Thước đo này phản ánh biến động giá của nhóm cổ phiếu đầu ngành có nền tảng tài chính vượt trội. Toàn bộ các mã thành phần đều có tỷ lệ sở hữu nước ngoài đạt từ 95% trở lên.<\/p>", "after": "<p>Chỉ số VN Diamond (Vietnam Diamond Index) là bộ chỉ số cổ phiếu kim cương của sàn HOSE, được vận hành chính thức từ tháng 11/2019. Thước đo này phản ánh biến động giá của nhóm cổ phiếu đầu ngành có nền tảng tài chính vượt trội. Toàn bộ các mã thành phần đều có tỷ lệ sở hữu nước ngoài đạt từ 95% trở lên. Đây là một chỉ số đầu tư trong hệ thống <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-chi-so-chung-khoan-viet-nam-hieu-ro-ve-vn-index-vn-30-hnx-index-va-nhieu-chi-so-khac\">các chỉ số chứng khoán Việt Nam<\/a>, bên cạnh VN-Index và nhóm chỉ số theo quy mô vốn hóa.<\/p>", "links": [{"to": "cac-chi-so-chung-khoan-viet-nam-hieu-ro-ve-vn-index-vn-30-hnx-index-va-nhieu-chi-so-khac", "url": "https://www.dsc.com.vn/kien-thuc/cac-chi-so-chung-khoan-viet-nam-hieu-ro-ve-vn-index-vn-30-hnx-index-va-nhieu-chi-so-khac", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=2"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Chỉ số VN Diamond khác gì quỹ ETF DCVFMVN Diamond?", "before": "<p>Nhiều nhà đầu tư mới thường nhầm lẫn giữa hai khái niệm này. Chỉ số VN Diamond là thước đo thống kê do sàn HOSE quản lý và tính toán. Trong khi đó, quỹ ETF DCVFMVN Diamond là sản phẩm tài chính đại chúng mô phỏng chỉ số đó.<\/p>", "after": "<p>Nhiều nhà đầu tư mới thường nhầm lẫn giữa hai khái niệm này. Chỉ số VN Diamond là thước đo thống kê do sàn HOSE const st=JSON.parse(localStorage.getItem(KEY)||"{}");const save=()=>localStorage.setItem(KEY,JSON.stringify(st));
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GN={fix:"Sửa link sai",cluster:"Link pillar/hub",backfill:"Link tới bài traffic cao",...DATA.groups};
const fG=document.getElementById("fG");for(const g of [...new Set(DATA.arts.flatMap(a=>a.group))])fG.add(new Option(GN[g]||g,g));
function preview(after,item){const d=document.createElement("div");d.innerHTML=after;
  const urls=new Set(item.links.filter(l=>l.op!=="unlink").map(l=>l.url));
  d.querySelectorAll("a").forEach(a=>{if(urls.has(a.getAttribute("href")))a.className="new";a.removeAttribute("target");a.onclick=e=>e.preventDefault()});
  d.querySelectorAll("img").forEach(i=>i.remove());return d.innerHTML}
function render(){const L=document.getElementById("list");L.innerHTML="";
 DATA.arts.forEach(a=>{const art=document.createElement("article");art.dataset.slug=a.slug;
  art.innerHTML=`<div class="head"><div><h2>${esc(a.title)}</h2><a href="${a.url}" target="_blank">${a.slug}</a>
   <div>${a.group.map(g=>`<span class="badge g-${g}">${GN[g]||g}</span>`).join("")}<span class="badge ${a.pri}">${a.pri}</span>
   <span class="badge">${a.clicks} clicks GSC</span><span class="badge">${a.items.length} block</span></div></div>
   <label class="complete"><input type="checkbox" data-art="${a.slug}"> Đã sửa xong bài này</label></div>`;
  a.items.forEach((it,k)=>{const id=a.slug+"#"+k;const c=document.createElement("div");c.className="chg";c.dataset.id=id;
   c.dataset.g=it.group.join(" ");c.dataset.p=it.pri;
   c.innerHTML=`<div class="chg-head"><div><b>${k+1}. ${esc(it.pos)}</b>
    <ul class="links">${it.links.map(l=>`<li><span class="badge g-${l.group}">${l.op}</span> ${l.op==="unlink"||l.op==="remove"||l.op==="cut"?`${l.op==="remove"?"xoá dòng":l.op==="cut"?"gỡ câu chứa link":"bỏ link"} <code>${l.to}</code>`:`→ <code>${l.to}</code> «${esc(l.anchor)}»`} <span class="why">— ${esc(l.why)}</span></li>`).join("")}</ul></div>
    <label class="complete"><input type="checkbox" data-id="${id}"> Xong</label></div>
    <div class="cols"><div><h3>Trước (tìm trong CMS) <button class="copy" data-t="b">Copy</button></h3><pre>${esc(it.before)}</pre></div>
    <div><h3>Sau (dán đè) <button class="copy" data-t="a">Copy</button></h3><pre>${it.after?esc(it.after):"(xoá cả block này)"}</pre></div></div>
    <h3 style="font-size:13px">Xem trước</h3><div class="preview">${preview(it.after,it)}</div>`;
   c.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.t==="a"?it.after:it.before);b.classList.add("ok");b.textContent="Đã copy";setTimeout(()=>{b.classList.remove("ok");b.textContent="Copy"},1200)});
   art.appendChild(c)});
  L.appendChild(art)});
 document.querySelectorAll("input[data-id]").forEach(x=>{x.checked=!!st[x.dataset.id];x.onchange=()=>{st[x.dataset.id]=x.checked;sync(x.closest("article"));save();apply()}});
 document.querySelectorAll("input[data-art]").forEach(x=>{x.onchange=()=>{x.closest("article").querySelectorAll("input[data-id]").forEach(y=>{y.checked=x.checked;st[y.dataset.id]=x.checked});save();apply()}});
 document.querySelectorAll("article").forEach(sync);apply()}
function sync(art){const ys=[...art.querySelectorAll("input[data-id]")];art.querySelector("input[data-art]").checked=ys.every(y=>y.checked)}
function apply(){const g=fG.value,p=document.getElementById("fP").value,q=document.getElementById("fQ").value.toLowerCase(),hide=document.getElementById("fD").value==="hide";
 let tot=0,dn=0;
 document.querySelectorAll("article").forEach(art=>{const a=DATA.arts.find(x=>x.slug===art.dataset.slug);let vis=0;
  art.querySelectorAll(".chg").forEach(c=>{const d=!!st[c.dataset.id];tot++;dn+=d;c.classList.toggle("done",d);
   const show=(g==="all"||c.dataset.g.split(" ").includes(g))&&(p==="all"||c.dataset.p===p)&&!(hide&&d);c.hidden=!show;vis+=show});
  const allDone=[...art.querySelectorAll(".chg")].every(c=>st[c.dataset.id]);art.classList.toggle("done",allDone);
  art.hidden=!vis||(q&&!(a.slug+" "+a.title).toLowerCase().includes(q))});
 document.getElementById("sum").textContent=`${dn}/${tot} block đã sửa · ${DATA.arts.length} bài`;document.getElementById("bar").style.width=(tot?100*dn/tot:0)+"%"}
["fG","fP","fQ","fD"].forEach(i=>document.getElementById(i).addEventListener("input",apply));
document.getElementById("exp").onclick=()=>{const s=DATA.arts.filter(a=>a.items.some((_,k)=>st[a.slug+"#"+k])).map(a=>a.slug);
 navigator.clipboard.writeText("python scripts/sync_live.py --only "+s.join(","));document.getElementById("exp").textContent="Đã copy lệnh sync ("+s.length+" bài)"};
render();
</script>
