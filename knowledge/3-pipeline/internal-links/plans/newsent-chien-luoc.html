nh cao nhất (Peak) đến điểm đáy thấp nhất (Trough) trong một giai đoạn nhất định. Đây là thước đo rủi ro then chốt, giúp nhà đầu tư nhận diện mức thua lỗ tối đa mà họ có thể phải đối mặt. Cần lưu ý, Drawdown phản ánh mức lỗ tạm thời trên giá trị tài sản ròng (NAV) và chỉ trở thành lỗ thực tế khi nhà đầu tư quyết định đóng vị thế (bán cổ phiếu).<\/p>", "after": "<p>Drawdown (Mức sụt giảm vốn) là chỉ số đo lường mức độ sụt giảm giá trị của một danh mục đầu tư hoặc tài khoản giao dịch, tính từ điểm đỉnh cao nhất (Peak) đến điểm đáy thấp nhất (Trough) trong một giai đoạn nhất định. Đây là thước đo rủi ro then chốt, giúp nhà đầu tư nhận diện mức thua lỗ tối đa mà họ có thể phải đối mặt. Cần lưu ý, Drawdown phản ánh mức lỗ tạm thời trên giá trị tài sản ròng (NAV) và chỉ trở thành lỗ thực tế khi nhà đầu tư quyết định đóng vị thế (bán cổ phiếu). Drawdown cho biết tài khoản đã mất bao nhiêu, còn <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/ty-le-risk-reward-la-gi\">tỷ lệ risk/reward<\/a> cho biết mỗi lệnh đang chấp nhận lỗ bao nhiêu để kiếm bao nhiêu.<\/p>", "links": [{"to": "ty-le-risk-reward-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/ty-le-risk-reward-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=5"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "backtest-la-gi", "title": "Backtest là gì? 5 bước kiểm thử chiến lược thực chiến", "url": "https://www.dsc.com.vn/kien-thuc/backtest-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Backtest là gì trong giao dịch tài chính?", "before": "<p>Backtest (kiểm thử lịch sử) là phương pháp sử dụng dữ liệu thị trường quá khứ để chạy thử nghiệm chiến lược giao dịch.<\/p>", "after": "<p>Backtest (kiểm thử lịch sử) là phương pháp sử dụng dữ liệu thị trường quá khứ để chạy thử nghiệm chiến lược giao dịch. Phần lớn <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-chien-luoc-dau-tu-chung-khoan-pho-bien-tren-thi-truong\">chiến lược P2", "why": "pillar · đoạn i=27"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Xây dựng danh mục đầu tư tối ưu", "before": "<p>Nhà đầu tư sử dụng hệ số Beta để cân bằng danh mục, kết hợp cổ phiếu có Beta khác nhau nhằm kiểm soát rủi ro tổng thể.<br>Ví dụ: Danh mục gồm 50% cổ phiếu Beta = 1.4 và 50% cổ phiếu Beta = 0.6 có Beta danh mục = 1.0, biến động tương đương thị trường.<\/p>", "after": "<p>Nhà đầu tư sử dụng hệ số Beta để cân bằng danh mục, kết hợp cổ phiếu có Beta khác nhau nhằm <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/quan-tri-rui-ro-la-gi-2\">kiểm soát rủi ro<\/a> tổng thể.<br>Ví dụ: Danh mục gồm 50% cổ phiếu Beta = 1.4 và 50% cổ phiếu Beta = 0.6 có Beta danh mục = 1.0, biến động tương đương thị trường.<\/p>", "links": [{"to": "quan-tri-rui-ro-la-gi-2", "url": "https://www.dsc.com.vn/kien-thuc/quan-tri-rui-ro-la-gi-2", "anchor": "kiểm soát rủi ro", "op": "wrap", "group": "cluster", "pri": "P2", "why": "hub · bọc cụm có sẵn"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Lưu ý khi sử dụng hệ số beta", "before": "<li>Hệ số beta chỉ đo lường mức độ rủi ro hệ thống của một cổ phiếu hoặc danh mục đầu tư. Mức độ rủi ro tổng thể của một cổ phiếu hoặc danh mục đầu tư còn phụ thuộc vào nhiều yếu tố khác, chẳng hạn như rủi ro phi hệ thống, rủi ro thị trường.<\/li>", "after": "<li>Hệ số beta chỉ đo lường mức độ rủi ro hệ thống của một cổ phiếu hoặc <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/danh-muc-dau-tu-hieu-qua-la-gi\">danh mục đầu tư<\/a>. Mức độ rủi ro tổng thể của một cổ phiếu hoặc danh mục đầu tư còn phụ thuộc vào nhiều yếu tố khác, chẳng hạn như rủi ro phi hệ thống, rủi ro thị trường.<\/li>", "links": [{"to": "danh-muc-dau-tu-hieu-qua-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/danh-muc-dau-tu-hieu-qua-la-gi", "anchor": "danh mục đầu tư", "op": "wrap", "group": "cluster", "pri": "P2", "why": "sub-hub · bọc cụm có sẵn"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "hieu-ung-dam-dong-la-gi-ung-dung-trong-dau-tu-chung-khoan", "title": "Hiệu ứng đám đông là gì? Ứng dụng trong đầu tư chứng khoán", "url": "https://www.dsc.com.vn/kien-thuc/hieu-ung-dam-dong-la-gi-ung-dung-trong-dau-tu-chung-khoan", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Hiệu ứng đám đông là gì?", "before": "<p>Hiệu ứng đám đông (herd mentality) là một hiện tượng tâm lý trong đó một nhóm người có xu hướng hành động theo nhau, bất kể hành động đó là đúng hay sai. Hiệu ứng này có thể được tìm thấy trong nhiều lĩnh vực khác nhau của cuộc sống, bao gồm cả đầu tư chứng khoán.<\/p>", "after": "<p>Hiệu ứng đám đông (herd mentality) là một hiện tượng tâm lý trong đó một nhóm người có xu hướng hành động theo nhau, bất kể hành động đó là đúng hay sai. Hiệu ứng này có thể được tìm thấy trong nhiều lĩnh vực khác nhau của cuộc sống, bao gồm cả đầu tư chứng khoán. Trong tài chính hành vi, đây là một dạng <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/thien-kien-nhan-thuc-la-gi\">thiên kiến nhận thức<\/a>, khiến nhà đầu tư coi hành động của số đông là bằng chứng.<\/p>", "links": [{"to": "thien-kien-nhan-thuc-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/thien-kien-nhan-thuc-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=2"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Đầu tư theo xu hướng", "before": "<p>Xu hướng được tạo ra bởi đám đông. Chiến lược này là nương theo dòng tiền đang chảy mạnh vào một cổ phiếu hoặc một nhóm ngành. Dấu hiệu nhận biết là giá và khối lượng giao dịch cùng tăng đột biến.<\/p>", "after": "<p>Xu hướng được tạo ra bởi đám đông. Chiến lược này là nương theo dòng tiền đang chảy mạnh vào một cổ phiếu hoặc một nhóm ngành. Dấu hiệu nhận biết là giá và khối lượng giao dịch cùng tăng đột biến. Đây là nhóm <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-chien-luoc-dau-tu-chung-khoan-pho-bien-tren-thi-truong\">chiến lược đầu tư chứng khoán<\/a> quen thuộc với người giao dịch ngắn và trung hạn.<\/p>", "link const st=JSON.parse(localStorage.getItem(KEY)||"{}");const save=()=>localStorage.setItem(KEY,JSON.stringify(st));
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GN={fix:"Sửa link sai",cluster:"Link pillar/hub",backfill:"Link tới bài traffic cao",...DATA.groups};

function preview(after,item){const d=document.createElement("div");d.innerHTML=after;
  const urls=new Set(item.links.filter(l=>l.op!=="unlink").map(l=>l.url));
  d.querySelectorAll("a").forEach(a=>{if(urls.has(a.getAttribute("href")))a.className="new";a.removeAttribute("target");a.onclick=e=>e.preventDefault()});
  d.querySelectorAll("img").forEach(i=>i.remove());return d.innerHTML}
function render(){const L=document.getElementById("list");L.innerHTML="";
 DATA.arts.forEach(a=>{const art=document.createElement("article");art.dataset.slug=a.slug;
  art.innerHTML=`<div class="head"><div><h2>${esc(a.title)}</h2><a href="${a.url}" target="_blank">${a.slug}</a>
   <div>${a.group.map(g=>`<span class="badge g-${g}">${GN[g]||g}</span>`).join("")}<span class="badge ${a.pri}">${a.pri}</span>

  a.items.forEach((it,k)=>{const id=a.slug+"#"+k;const c=document.createElement("div");c.className="chg";c.dataset.id=id;
   c.dataset.g=it.group.join(" ");c.dataset.p=it.pri;
   c.innerHTML=`<div class="chg-head"><div><b>${k+1}. ${esc(it.pos)}</b>

    <label class="complete"><input type="checkbox" data-id="${id}"> Xong</label></div>
    <div class="cols"><div><h3>Trước (tìm trong CMS) <button class="copy" data-t="b">Copy</button></h3><pre>${esc(it.before)}</pre></div>
    <div><h3>Sau (dán đè) <button class="copy" data-t="a">Copy</button></h3><pre>${it.after?esc(it.after):"(xoá cả block này)"}</pre></div></div>
    <h3 style="font-size:13px">Xem trước</h3><div class="preview">${preview(it.after,it)}</div>`;
   c.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.t==="a"?it.after:it.before);b.classList.add("ok");b.textContent="Đã copy";setTimeout(()=>{b.classList.remove("ok");b.textContent="Copy"},1200)});
   art.appendChild(c)});
  L.appendChild(art)});
 document.querySelectorAll("input[data-id]").forEach(x=>{x.checked=!!st[x.dataset.id];x.onchange=()=>{st[x.dataset.id]=x.checked;sync(x.closest("article"));save();apply()}});
 document.querySelectorAll("input[data-art]").forEach(x=>{x.onchange=()=>{x.closest("article").querySelectorAll("input[data-id]").forEach(y=>{y.checked=x.checked;st[y.dataset.id]=x.checked});save();apply()}});
 document.querySelectorAll("article").forEach(sync);apply()}
function sync(art){const ys=[...art.querySelectorAll("input[data-id]")];art.querySelector("input[data-art]").checked=ys.every(y=>y.checked)}
function apply(){const g=fG.value,p=document.getElementById("fP").value,q=document.getElementById("fQ").value.toLowerCase(),hide=document.getElementById("fD").value==="hide";
 let tot=0,dn=0;
 document.querySelectorAll("article").forEach(art=>{const a=DATA.arts.find(x=>x.slug===art.dataset.slug);let vis=0;
  art.querySelectorAll(".chg").forEach(c=>{const d=!!st[c.dataset.id];tot++;dn+=d;c.classList.toggle("done",d);
   const show=(g==="all"||c.dataset.g.split(" ").includes(g))&&(p==="all"||c.dataset.p===p)&&!(hide&&d);c.hidden=!show;vis+=show});
  const allDone=[...art.querySelectorAll(".chg")].every(c=>st[c.dataset.id]);art.classList.toggle("done",allDone);
  art.hidden=!vis||(q&&!(a.slug+" "+a.title).toLowerCase().includes(q))});
 document.getElementById("sum").textContent=`${dn}/${tot} block đã sửa · ${DATA.arts.length} bài`;document.getElementById("bar").style.width=(tot?100*dn/tot:0)+"%"}
["fG","fP","fQ","fD"].forEach(i=>document.getElementById(i).addEventListener("input",apply));
document.getElementById("exp").onclick=()=>{const s=DATA.arts.filter(a=>a.items.some((_,k)=>st[a.slug+"#"+k])).map(a=>a.slug);
 navigator.clipboard.writeText("python scripts/sync_live.py --only "+s.join(","));document.getElementById("exp").textContent="Đã copy lệnh sync ("+s.length+" bài)"};
render();
