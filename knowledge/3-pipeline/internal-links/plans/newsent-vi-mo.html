nhóm các nền kinh tế phát triển.<\/p>", "after": "<p>Cấu trúc rổ tiền tệ của DXY vẫn giữ nguyên từ năm 1999 đến nay. Rổ tính toán này chưa phản ánh các đối tác thương mại lớn mới nổi như Trung Quốc hay Hàn Quốc. Vì vậy, DXY phản ánh chủ yếu tương quan giữa USD với nhóm các nền kinh tế phát triển. Khi làm <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi\">phân tích vĩ mô<\/a> cho thị trường Việt Nam, nhà đầu tư cần theo dõi cả tỷ giá USD/VND thay vì chỉ nhìn DXY.<\/p>", "links": [{"to": "phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "pillar · đoạn i=44"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "canh-tranh-khong-hoan-hao-phan-tich-chi-tiet-cac-mo-hinh", "title": "Cạnh tranh không hoàn hảo là gì? Các loại Cạnh tranh không hoàn hảo", "url": "https://www.dsc.com.vn/kien-thuc/canh-tranh-khong-hoan-hao-phan-tich-chi-tiet-cac-mo-hinh", "clicks": 19, "pri": "P1", "group": ["cluster"], "items": [{"pos": "Cạnh tranh không hoàn hảo là gì?", "before": "<p>Cạnh tranh không hoàn hảo là hình thức thị trường trong đó các điều kiện của cạnh tranh hoàn hảo không được đáp ứng đầy đủ. Trong mô hình này, doanh nghiệp không chỉ đóng vai trò “chấp nhận giá” mà có khả năng chi phối hoặc tác động nhất định đến mức giá trên thị trường nhờ lợi thế về quy mô, vị thế hoặc cấu trúc thị trường.<\/p>", "after": "<p>Cạnh tranh không hoàn hảo là hình thức thị trường trong đó các điều kiện của cạnh tranh hoàn hảo không được đáp ứng đầy đủ. Trong mô hình này, doanh nghiệp không chỉ đóng vai trò “chấp nhận giá” mà có khả năng chi phối hoặc tác động nhất định đến mức giá trên thị trường nhờ lợi thế về quy mô, vị thế hoặc cấu trúc thị trường. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/kinh-te-hoc-vi-mo-la-gi-y-nghia-trong-dau-tu-chung-khoan\">kinh tế học vi mô<\/a>, đây là nhóm cấu trúc thị trường phổ biến nhất ngoài thực tế, gồm độc quyền, độc quyền nhóm và cạnh tranh độc quyền.<\/p>", "links": [{"to": "kinh-te-hoc-vi-mo-la-gi-y-nghia-trong-dau-tu-chung-khoan", "url": "https://www.dsc.com.vn/kien-thuc/kinh-te-hoc-vi-mo-la-gi-y-nghia-trong-dau-tu-chung-khoan", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "hub · đoạn i=2"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "thi-truong-tien-te-la-gi-phan-tich-vai-tro-va-cac-thanh-phan", "title": "Thị trường tiền tệ là gì? Phân tích vai trò và các thành phần", "url": "https://www.dsc.com.vn/kien-thuc/thi-truong-tien-te-la-gi-phan-tich-vai-tro-va-cac-thanh-phan", "clicks": 19, "pri": "P1", "group": ["cluster"], "items": [{"pos": "Vai trò của thị trường tiền tệ", "before": "<p>Thị trường tiền tệ đóng vai trò cung cấp nguồn vốn ngắn hạn cho các tổ chức, doanh nghiệp và chính phủ để đáp ứng nhu cầu tài trợ cho hoạt động kinh doanh và đầu tư.<\/p>", "after": "<p>Thị trường tiền tệ đóng vai trò cung cấp nguồn vốn ngắn hạn cho các tổ chức, doanh nghiệp và chính phủ để đáp ứng nhu cầu tài trợ cho hoạt động kinh doanh và đầu tư. Chính phủ vay ngắn hạn qua tín phiếu kho bạc tại đây, điểm giao nhau giữa <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te\">chính sách tài khóa và chính sách tiền tệ<\/a>.<\/p>", "links": [{"to": "so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "url": "https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "hub · đoạn i=7"}], "group": ["cluster"], "pri": "P1"}, {"pos": "Vai trò của thị trường tiền tệ", "before": "<p>Ngoài ra, thị trường tiền tệ còn có các nhiệm vụ khác như: Giúp cân bằng cung cầu về vốn ngắn hạn trong nền kinh tế; Tạo kênh đầu tư an toàn và sinh lời cho các nhà đầu tư; Thúc đẩy hoạt động kinh tế và phát triển thị trường tài chính.<\/p>", "after": "<p>Ngoài ra, thị trường tiền tệ còn có các nhiệm vụ khác như: Giúp cân bằng cung cầu về vốn ngắn hạn trong nền kinh tế; Tạo kênh đầu tư an toàn và sinh lời cho các nhà đầu tư; Thúc đẩy hoạt động kinh tế và phát triển thị trường tài chính. Đây cũng là nơi Ngân hàng Nhà nước thực thi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chinh-sach-tien-te-la-gi\">chính sách tiền tệ<\/a> thông qua nghiệp vụ thị trường mở và lãi suất điều hành.<\/p>", "links": [{"to": "chinh-sach-tien-te-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/chinh-sach-tien-te-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "sub-hub · đoạn i=8"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "ecb-la-gi-vai-tro-va-chuc-nang-cua-ngan-hang-trung-uong-chau-au", "title": "ECB là gì? Vai trò và chức năng của Ngân hàng Trung ương châu Âu", "url": "https://www.dsc.com.vn/kien-thuc/ecb-la-gi-vai-tro-va-chuc-nang-cua-ngan-hang-trung-uong-chau-au", "clicks": 13, "pri": "P1", "group": ["cluster"], "items": [{"pos": "Thiết lập và thực hiện chính sách tiền tệ", "before": "<p>ECB chịu trách nhiệm thiết lập và thực hiện <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chinh-sach-tien-te-la-gi\"><strong>chính sách tiền tệ<\/strong><\/a> của Khu vực đồng Euro. Chính sách tiền tệ của ECB nhằm mục tiêu duy trì ổn định giá cả và thúc đẩy tăng trưởng kinh tế.<\/p>", "after": "<p>ECB chịu trách nhiệm thiết lập và thực hiện <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chinh-sach-tien-te-la-gi\"><strong>chính sách tiền tệ<\/strong><\/a> của Khu vực đồng Euro. Chính sách tiền tệ của ECB nhằm mục tiêu duy trì ổn định giá cả và thúc đẩy tăng trưởng kinh tế. ECB chỉ nắm tiền tệ, còn ngân sách do từng nước thành viên quyết định, khác với thế phối hợp <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te\">chính sách tài khóa và tiền tệ<\/a> ở một nước.<\/p>", "links": [{"to": "so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "url": "https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "hub · đoạn i=14"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "ty-le-du-tru-bat-buoc-la-gi-va-moi-quan-he-voi-cung-cau-tien", "title": "Tỷ lệ dự trữ bắt buộc là gì? Mối quan hệ với cung - cầu tiền", "url": "https://www.dsc.com.vn/kien-thuc/ty-le-du-tru-bat-buoc-la-gi-va-moi-quan-he-voi-cung-cau-tien", "clicks": 13, "pri": "P1", "group": ["cluster"], "items": [{"pos": "Tỷ lệ dự trữ bắt buộc là gì?", "before": "<p>Tỷ lệ dự trữ bắt buộc (RRR - Reserve Requirement Ratio) là tỷ lệ phần trăm tối thiểu lượng tiền mà các tổ chức tín dụng (như ngân hàng) phải giữ lại tại Ngân hàng Nhà nước (NHNN). Tỷ lệ này do NHNN quy định nhằm đảm bảo khả năng thanh toán của các ngân hàng và kiểm soát lượng tiền lưu thông trong nền kinh tế.<\/p>", "after": "<p>Tỷ lệ dự trữ bắt buộc (RRR - Reserve Requirement Ratio) là tỷ lệ phần trăm tối thiểu lượng tiền mà các tổ chức tín dụng (như ngân hàng) phải giữ lại tại Ngân hàng Nhà nước (NHNN). Tỷ lệ này do NHNN quy định nhằm đảm bảo khả năng thanh toán của các ngân hàng và kiểm soát lượng tiền lưu thông trong nền kinh tế. Đây là một công cụ thuộc nhánh tiền tệ trong bộ đôi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te\">chính sách tài khóa và chính sách tiền tệ<\/a> mà Nhà nước dùng để điều tiết kinh tế.<\/p>", "links": [{"to": "so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "url": "https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "hub · đoạn i=7"}], "group": ["cluster"], "pri": "P1"}, {"pos": "Ví dụ về tỷ lệ dự trữ bắt buộc", "before": "<p>NHNN giảm tỷ lệ dự trữ bắt buộc từ 10% xuống 8%. Điều này có nghĩa là các ngân hàng có thể cho vay nhiều hơn, dẫn đến tăng cung tiền.<\/p>", "a ks": 6, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Vốn FPI là gì?", "before": "<p>Tại Việt Nam, khái niệm vốn FPI thường được nhắc đến nhiều nhất trên thị trường chứng khoán, nơi các quỹ đầu tư nước ngoài (như ETF) mua bán hàng ngày. Đây là một phần quan trọng của dòng vốn quốc tế, đóng vai trò như một nguồn lực bổ sung thanh khoản cho thị trường nội địa.<\/p>", "after": "<p>Tại Việt Nam, khái niệm vốn FPI thường được nhắc đến nhiều nhất trên thị trường chứng khoán, nơi các quỹ đầu tư nước ngoài (như ETF) mua bán hàng ngày. Đây là một phần quan trọng của dòng vốn quốc tế, đóng vai trò như một nguồn lực bổ sung thanh khoản cho thị trường nội địa. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/can-can-thanh-toan-bop-la-gi\">cán cân thanh toán quốc tế<\/a>, vốn FPI được ghi ở cán cân tài chính, cùng với FDI và các khoản vay nước ngoài.<\/p>", "links": [{"to": "can-can-thanh-toan-bop-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/can-can-thanh-toan-bop-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=3"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Nhà đầu tư cá nhân làm thế nào để \"đón sóng\" FPI hiệu quả?", "before": "<p>Hiểu rõ vốn FPI là gì chưa đủ, bạn cần biết cách hành động. Theo dõi dòng tiền \"cá mập\" ngoại là một chiến lược phổ biến để tối ưu hóa lợi nhuận.<\/p>", "after": "<p>Hiểu rõ vốn FPI là gì chưa đủ, bạn cần biết cách hành động. Theo dõi dòng tiền \"cá mập\" ngoại là một chiến lược phổ biến để tối ưu hóa lợi nhuận. Bước đầu là <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi\">phân tích vĩ mô<\/a>: chênh lệch lãi suất và tỷ giá USD/VND quyết định hướng đi của dòng vốn này.<\/p>", "links": [{"to": "phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn h tế tổng thể. Khi giá cả của những mặt hàng cơ bản như thực phẩm và năng lượng tăng lên, có thể tạo ra áp lực lớn đối với người tiêu dùng và doanh nghiệp.<\/p>", "after": "<p>Giỏ hàng tiêu dùng không chỉ là một chỉ số đo lường sự biến động giá cả mà còn phản ánh tình hình kinh tế tổng thể. Khi giá cả của những mặt hàng cơ bản như thực phẩm và năng lượng tăng lên, có thể tạo ra áp lực lớn đối với người tiêu dùng và doanh nghiệp. <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/kinh-te-hoc-vi-mo-la-gi-y-nghia-trong-dau-tu-chung-khoan\">Kinh tế vi mô<\/a> giải thích phản ứng này: khi giá hàng thiết yếu tăng, hộ gia đình cắt chi tiêu cho hàng không thiết yếu.<\/p>", "links": [{"to": "kinh-te-hoc-vi-mo-la-gi-y-nghia-trong-dau-tu-chung-khoan", "url": "https://www.dsc.com.vn/kien-thuc/kinh-te-hoc-vi-mo-la-gi-y-nghia-trong-dau-tu-chung-khoan", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=13"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "lai-suat-co-so-la-gi-tac-dong-cua-lai-suat-co-so-den-nen-kinh-te", "title": "Lãi suất cơ sở là gì? Vai trò, cách tính và tác động", "url": "https://www.dsc.com.vn/kien-thuc/lai-suat-co-so-la-gi-tac-dong-cua-lai-suat-co-so-den-nen-kinh-te", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Lãi suất cơ sở là gì?", "before": "<p>Lãi suất cơ sở (hay lãi suất cơ bản) là mức <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/lai-suat-la-gi\"><strong>lãi suất<\/strong><\/a> nền tảng do Ngân hàng Nhà nước công bố và chỉ áp dụng cho các giao dịch bằng đồng Việt Nam. Đây là cơ sở để các ngân hàng thương mại xây dựng và điều chỉnh lãi suất cho vay hoặc lãi suất tiền gửi theo từng kỳ nhất định.<\/p>", "after": "<p>Lãi suất cơ sở (hay lãi suất cơ bản) là mức <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/lai-suat-la-gi\"><strong>lãi suất<\/strong><\/a> nền tảng do Ngân hàng Nhà nước công bố và chỉ áp dụng cho các giao dịch bằng đồng Việt Nam. Đây là cơ sở để các ngân hàng thương mại xây dựng và điều chỉnh lãi suất cho vay hoặc lãi suất tiền gửi theo từng kỳ nhất định. Lãi suất này là một công cụ của nhánh tiền tệ trong cặp <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te\">chính sách tài khóa và chính sách tiền tệ<\/a>.<\/p>", "links": [{"to": "so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "url": "https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=4"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "lai-suat-dieu-hanh-la-gi", "title": "Lãi suất điều hành là gì? Bản chất và tác động chứng khoán", "url": "https://www.dsc.com.vn/kien-thuc/lai-suat-dieu-hanh-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Quan hệ giữa lãi suất điều hành và thị trường chứng khoán", "before": "<p>Tuy nhiên, các quyết định chính sách tiền tệ thường có độ trễ 3 đến 6 tháng. Thời gian này cần thiết để tác động phản ánh vào kết quả kinh doanh của doanh nghiệp.<\/p>", "after": "<p>Tuy nhiên, các quyết định chính sách tiền tệ thường có độ trễ 3 đến 6 tháng. Thời gian này cần thiết để tác động phản ánh vào kết quả kinh doanh của doanh nghiệp. Vì vậy, <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi\">phân tích vĩ mô<\/a> cần đi trước kết quả kinh doanh: nhà đầu tư theo dõi tín hiệu lãi suất trước khi lợi nhuận thay đổi.<\/p>", "links": [{"to": "phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=60"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Giai đoạn 2023–2026: 4 đợt giảm lãi suất điều hành tạo bệ đỡ vĩ mô", "before": "<p>Nhờ chính sách tiền tệ linh hoạt này, thị trường chứng khoán đã xác lập vùng đáy dài hạn và bước vào chu kỳ phục hồi bền vững.<\/p>", "after": "<p>Nhờ chính sách tiền tệ linh hoạt này, thị trường chứng khoán đã xác lập vùng đáy dài hạn và bước vào chu kỳ phục hồi bền vững. Lãi suất chỉ là một vế; vế còn lại là thuế và chi ngân sách trong cặp <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te\">chính sách tài khóa và chính sách tiền tệ<\/a>.<\/p>", "links": [{"to": "so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "url": "https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=71"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "lai-suat-lien-ngan-hang-la-gi-cach-tinh-tac-dong-va-cach-tra-cuu", "title": "Lãi suất liên ngân hàng là gì? Cách tính, tác động và cách tra cứu", "url": "https://www.dsc.com.vn/kien-thuc/lai-suat-lien-ngan-hang-la-gi-cach-tinh-tac-dong-va-cach-tra-cuu", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Mối quan hệ giữa lãi suất liên ngân hàng và chính sách tiền tệ", "before": "<p>Lãi suất liên ngân hàng tăng cao bất thường phản ánh tình trạng thiếu hụt thanh khoản, trong khi mức lãi suất quá thấp cho thấy hệ thống dư thừa vốn, là cơ sở để NHTW điều chỉnh chính sách kịp thời nhằm ổn định thị trường tài chính và đạt các mục tiêu vĩ mô.<\/p>", "after": "<p>Lãi suất liên ngân hàng tăng cao bất thường phản ánh tình trạng thiếu hụt thanh khoản, trong khi mức lãi suất quá thấp cho thấy hệ thống dư thừa vốn, là cơ sở để NHTW điều chỉnh chính sách kịp thời nhằm ổn định thị trường tài chính và đạt các mục tiêu vĩ mô. Thanh khoản hệ thống còn chịu tác động từ tiền gửi Kho bạc, điểm nối giữa <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te\">chính sách tài khóa và chính sách tiền tệ<\/a>.<\/p>", "links": [{"to": "so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "url": "https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=13"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Vai trò đối với nền kinh tế", "before": "<p>Bằng việc điều chỉnh mặt bằng lãi suất liên ngân hàng, Ngân hàng Trung ương có thể tác động đến lượng tiền lưu thông trong nền kinh tế, qua đó kiểm soát lạm phát, thúc đẩy tăng trưởng hoặc ổn định kinh tế trong những giai đoạn biến động.<\/p>", "after": "<p>Bằng việc điều chỉnh mặt bằng lãi suất liên ngân hàng, Ngân hàng Trung ương có thể tác động đến lượng tiền lưu thông trong nền kinh tế, qua đó kiểm soát lạm phát, thúc đẩy tăng trưởng hoặc ổn định kinh tế trong những giai đoạn biến động. Vì vậy, lãi suất qua đêm là số liệu được cập nhật hằng ngày trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi\">phân tích vĩ mô<\/a> của nhà đầu tư chứng khoán.<\/p>", "links": [{"to": "phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=18"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "lai-suat-omo-la-gi-giai-ma-cong-cu-dieu-tiet-thi-truong-tien-te-hieu-qua", "title": "Lãi suất OMO là gì? Giải mã công cụ điều tiết thị trường tiền tệ", "url": "https://www.dsc.com.vn/kien-thuc/lai-suat-omo-la-gi-giai-ma-cong-cu-dieu-tiet-thi-truong-tien-te-hieu-qua", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Một số lưu ý về lãi suất OMO", "before": "<p>Lãi suất OMO chỉ là một trong nhiều công cụ điều tiết tiền tệ mà NHNN sử dụng. NHNN sẽ phối hợp sử dụng lãi suất OMO với các công cụ khác như lãi suất tái cấp vốn, tỷ lệ dự trữ bắt buộc, v.v. để đạt được mục tiêu chính sách tiền tệ.<\/p>", "after": "<p>Lãi suất OMO chỉ là một trong nhiều công cụ điều tiết tiền tệ mà NHNN sử dụng. NHNN sẽ phối hợp sử dụng lãi suất OMO với các công cụ khác như lãi suất tái cấp vốn, tỷ lệ dự trữ bắt buộc, v.v. để đạt được mục tiêu chính sách tiền tệ. Ở tầng cao hơn, toàn bộ nhóm công cụ này lại được phối hợp với thuế và chi ngân sách trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te\">chính sách tài khóa và chính sách tiền tệ<\/a>.<\/p>", "links": [{"to": "so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "url": "https://www.dsc.com.vn/kien-thuc/so-sanh-chinh-sach-tai-khoa-va-chinh-sach-tien-te", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=24"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "no-chinh-phu-la-gi", "title": "Nợ chính phủ là gì? Tác động đến kinh tế và thị trường chứng khoán", "url": "https://www.dsc.com.vn/kien-thuc/no-chinh-phu-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Nợ Chính phủ là gì?", "before": "<p>Hãy tưởng tượng Chính phủ như một hộ gia đình quy mô lớn. Để xây dựng những công trình hạ tầng khổng lồ như đường cao tốc Bắc - Nam hay sân bay Long Thành, nguồn thu từ thuế đôi khi không đủ. Khi đó, Chính phủ phải đi vay từ người dân, doanh nghiệp hoặc các tổ chức quốc tế.<\/p>", "after": "<p>Hãy tưởng tượng Chính phủ như một hộ gia đình quy mô lớn. Để xây dựng những công trình hạ tầng khổng lồ như đường cao tốc Bắc - Nam hay sân bay Long Thành, nguồn thu từ thuế đôi khi không đủ. Khi đó, Chính phủ phải đi vay từ người dân, doanh nghiệp hoặc các tổ chức quốc tế. Mức vay này là kết quả của <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chinh-sach-tai-khoa-la-gi\">chính sách tài khóa<\/a>: chi ngân sách vượt thu thì phần thiếu hụt được bù bằng nợ.<\/p>", "links": [{"to": "chinh-sach-tai-khoa-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/chinh-sach-tai-khoa-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=9"}], "group": ["cluster"], "pri": "P2"}, {"po -khoan-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=47"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "su-kien-bong-bong-hoa-tulip-bai-hoc-kinh-nghiem-cho-cac-nha-dau-tu", "title": "Sự kiện bong bóng hoa tulip: Bài học kinh nghiệm cho nhà đầu tư", "url": "https://www.dsc.com.vn/kien-thuc/su-kien-bong-bong-hoa-tulip-bai-hoc-kinh-nghiem-cho-cac-nha-dau-tu", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Hậu quả của sự kiện bong bóng hoa tulip", "before": "<p>Sự kiện bong bóng hoa tulip đã gây ra những hậu quả nghiêm trọng cho nền kinh tế Hà Lan. Nhiều người đã mất trắng tiền của, dẫn đến sự suy thoái kinh tế. Chính phủ Hà Lan đã phải ban hành một số biện pháp để giải quyết tình trạng này, bao gồm cấm giao dịch hợp đồng tương lai của củ hoa tulip.<\/p>", "after": "<p>Sự kiện bong bóng hoa tulip đã gây ra những hậu quả nghiêm trọng cho nền kinh tế Hà Lan. Nhiều người đã mất trắng tiền của, dẫn đến sự suy thoái kinh tế. Chính phủ Hà Lan đã phải ban hành một số biện pháp để giải quyết tình trạng này, bao gồm cấm giao dịch hợp đồng tương lai của củ hoa tulip. Diễn biến này mang đủ các giai đoạn của một cuộc <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/khung-hoang-tai-chinh-la-gi-cac-giai-doan-cua-khung-hoang-tai-chinh\">khủng hoảng tài chính<\/a>: giá tăng nóng, hoảng loạn bán tháo và suy thoái.<\/p>", "links": [{"to": "khung-hoang-tai-chinh-la-gi-cac-giai-doan-cua-khung-hoang-tai-chinh", "url": "https://www.dsc.com.vn/kien-thuc/khung-hoang-tai-chinh-la-gi-cac-giai-doan-cua-khung-hoang-tai-chinh", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=17"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "von-oda-la-gi", "title": "Vốn ODA là gì? Phân loại và tác động đến chứng khoán", "url": "https://www.dsc.com.vn/kien-thuc/von-oda-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Vốn ODA là gì?", "before": "<p>Đối tượng nhận là các quốc gia đang phát triển. Mục đích cốt lõi nhằm thúc đẩy tăng trưởng kinh tế bền vững và nâng cao phúc lợi xã hội.<\/p>", "after": "<p>Đối tượng nhận là các quốc gia đang phát triển. Mục đích cốt lõi nhằm thúc đẩy tăng trưởng kinh tế bền vững và nâng cao phúc lợi xã hội. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/can-can-thanh-toan-bop-la-gi\">cán cân thanh toán quốc tế<\/a>, phần ODA vay ưu đãi được ghi nhận là dòng vốn vào ở cán cân tài chính.<\/p>", "links": [{"to": "can-can-thanh-toan-bop-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/can-can-thanh-toan-bop-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=4"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "xuat-sieu-la-gi", "title": "Xuất siêu là gì? Tác động nền kinh tế và ứng dụng đầu tư", "url": "https://www.dsc.com.vn/kien-thuc/xuat-sieu-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Chiến lược đầu tư chứng khoán từ xu hướng xuất nhập khẩu", "before": "<p>Sự thay đổi của cán cân thương mại là một trong những chỉ báo chu kỳ quan trọng giúp các nhà đầu tư trên thị trường chứng khoán đưa ra quyết định phân bổ vốn hợp lý.<\/p>", "after": "<p>Sự thay đổi của cán cân thương mại là một trong những chỉ báo chu kỳ quan trọng giúp các nhà đầu tư trên thị trường chứng khoán đưa ra quyết định phân bổ vốn hợp lý. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi\">phân tích vĩ mô<\/a>, số liệu xuất nhập khẩu hằng tháng được đọc cùng tỷ giá và dự trữ ngoại hối.<\/p>", "links": [{"to": "phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-vi-mo-trong-dau-tu-chung-khoan-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=65"}], "group": ["cluster"], "pri": "P2"}]}], "groups": {}};const KEY="linkplan:newsent-vi-mo";
const st=JSON.parse(localStorage.getItem(KEY)||"{}");const save=()=>localStorage.setItem(KEY,JSON.stringify(st));
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GN={fix:"Sửa link sai",cluster:"Link pillar/hub",backfill:"Link tới bài traffic cao",...DATA.groups};
const fG=document.getElementById("fG");for(const g of [...new Set(DATA.arts.flatMap(a=>a.group))])fG.add(new Option(GN[g]||g,g));
function preview(after,item){const d=document.createElement("div");d.innerHTML=after;
  const urls=new Set(item.links.filter(l=>l.op!=="unlink").map(l=>l.url));
  d.querySelectorAll("a").forEach(a=>{if(urls.has(a.getAttribute("href")))a.className="new";a.removeAttribute("target");a.onclick=e=>e.preventDefault()});
  d.querySelectorAll("img").forEach(i=>i.remove());return d.innerHTML}
function render(){const L=document.getElementById("list");L.innerHTML="";
 DATA.arts.forEach(a=>{const art=document.createElement("article");art.dataset.slug=a.slug;
  art.innerHTML=`<div class="head"><div><h2>${esc(a.title)}</h2><a href="${a.url}" target="_blank">${a.slug}</a>
   <div>${a.group.map(g=>`<span class="badge g-${g}">${GN[g]||g}</span>`).join("")}<span class="badge ${a.pri}">${a.pri}</span>
   <span class="badge">${a.clicks} clicks GSC</span><span class="badge">${a.items.length} block</span></div></div>
   <label class="complete"><input type="checkbox" data-art="${a.slug}"> Đã sửa xong bài này</label></div>`;
  a.items.forEach((it,k)=>{const id=a.slug+"#"+k;const c=document.createElement("div");c.className="chg";c.dataset.id=id;
   c.dataset.g=it.group.join(" ");c.dataset.p=it.pri;
   c.innerHTML=`<div class="chg-head"><div><b>${k+1}. ${esc(it.pos)}</b>
    <ul class="links">${it.links.map(l=>`<li><span class="badge g-${l.group}">${l.op}</span> ${l.op==="unlink"||l.op==="remove"||l.op==="cut"?`${l.op==="remove"?"xoá dòng":l.op==="cut"?"gỡ câu chứa link":"bỏ link"} <code>${l.to}</code>`:`→ <code>${l.to}</code> «${esc(l.anchor)}»`} <span class="why">— ${esc(l.why)}</span></li>`).join("")}</ul></div>
    <label class="complete"><input type="checkbox" data-id="${id}"> Xong</label></div>
    <div class="cols"><div><h3>Trước (tìm trong CMS) <button class="copy" data-t="b">Copy</button></h3><pre>${esc(it.before)}</pre></div>
    <div><h3>Sau (dán đè) <button class="copy" data-t="a">Copy</button></h3><pre>${it.after?esc(it.after):"(xoá cả block này)"}</pre></div></div>
    <h3 style="font-size:13px">Xem trước</h3><div class="preview">${preview(it.after,it)}</div>`;
   c.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.t==="a"?it.after:it.before);b.classList.add("ok");b.textContent="Đã copy";setTimeout(()=>{b.classList.remove("ok");b.textContent="Copy"},1200)});
   art.appendChild(c)});
  L.appendChild(art)});
 document.querySelectorAll("input[data-id]").forEach(x=>{x.checked=!!st[x.dataset.id];x.onchange=()=>{st[x.dataset.id]=x.checked;sync(x.closest("article"));save();apply()}});
 document.querySelectorAll("input[data-art]").forEach(x=>{x.onchange=()=>{x.closest("article").querySelectorAll("input[data-id]").forEach(y=>{y.checked=x.checked;st[y.dataset.id]=x.checked});save();apply()}});
 document.querySelectorAll("article").forEach(sync);apply()}
function sync(art){const ys=[...art.querySelectorAll("input[data-id]")];art.querySelector("input[data-art]").checked=ys.every(y=>y.checked)}
function apply(){const g=fG.value,p=document.getElementById("fP").value,q=document.getElementById("fQ").value.toLowerCase(),hide=document.getElementById("fD").value==="hide";
 let tot=0,dn=0;
 document.querySelectorAll("article").forEach(art=>{const a=DATA.arts.find(x=>x.slug===art.dataset.slug);let vis=0;
  art.querySelectorAll(".chg").forEach(c=>{const d=!!st[c.dataset.id];tot++;dn+=d;c.classList.toggle("done",d);
   const show=(g==="all"||c.dataset.g.split(" ").includes(g))&&(p==="all"||c.dataset.p===p)&&!(hide&&d);c.hidden=!show;vis+=show});
  const allDone=[...art.querySelectorAll(".chg")].every(c=>st[c.dataset.id]);art.classList.toggle("done",allDone);
  art.hidden=!vis||(q&&!(a.slug+" "+a.title).toLowerCase().includes(q))});
 document.getElementById("sum").textContent=`${dn}/${tot} block đã sửa · ${DATA.arts.length} bài`;document.getElementById("bar").style.width=(tot?100*dn/tot:0)+"%"}
["fG","fP","fQ","fD"].forEach(i=>document.getElementById(i).addEventListener("input",apply));
document.getElementById("exp").onclick=()=>{const s=DATA.arts.filter(a=>a.items.some((_,k)=>st[a.slug+"#"+k])).map(a=>a.slug);
 navigator.clipboard.writeText("python scripts/sync_live.py --only "+s.join(","));document.getElementById("exp").textContent="Đã copy lệnh sync ("+s.length+" bài)"};
render();
</script>
