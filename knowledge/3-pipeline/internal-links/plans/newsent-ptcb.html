1", "group": ["cluster"], "items": [{"pos": "Lợi ích của phát hành cổ phiếu ESOP", "before": "<p>Cổ phiếu ESOP giúp doanh nghiệp giữ chân nhân viên nòng cốt thông qua cơ chế phát hành cổ phiếu ưu đãi với giá bằng mệnh giá (<strong>10.000 VNĐ/cổ phiếu<\/strong>) hoặc 0 đồng, thay vì phải chi trả thưởng bằng tiền mặt. Về bản chất, doanh nghiệp tăng thêm lượng cổ phiếu lưu hành và phân phối cho cán bộ nhân viên nội bộ.<\/p>", "after": "<p>Cổ phiếu ESOP giúp doanh nghiệp giữ chân nhân viên nòng cốt thông qua cơ chế phát hành cổ phiếu ưu đãi với giá bằng mệnh giá (<strong>10.000 VNĐ/cổ phiếu<\/strong>) hoặc 0 đồng, thay vì phải chi trả thưởng bằng tiền mặt. Về bản chất, doanh nghiệp tăng thêm lượng cổ phiếu lưu hành và phân phối cho cán bộ nhân viên nội bộ. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, lượng cổ phiếu ESOP phát hành hằng năm cần được tính vào mức pha loãng EPS.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "pillar · đoạn i=22"}], "group": ["cluster"], "pri": "P1"}, {"pos": "Hạn chế và rủi ro của phát hành cổ phiếu ESOP", "before": "<p>Chính sách phân phối ESOP theo chức danh và vị trí công việc tạo ra sự mất cân bằng trong nội bộ doanh nghiệp. Các nhân viên cấp cao và ban lãnh đạo nhận được tỷ lệ cổ phiếu ESOP lớn hơn đáng kể so với nhân viên cấp dưới. Trong một số trường hợp, toàn bộ cổ phiếu ESOP chỉ được phân bổ cho ban lãnh đạo công ty, khiến chương trình mất đi vai trò gắn kết đội ngũ nhân viên rộng hơn.<\/p>", "after": "<p>Chính sách phân phối ESOP theo chức danh và vị trí công việc tạo ra sự mất cân bằng trong nội bộ doanh nghiệp. Các nhân viên cấp cao và ban lãnh đạo nhận được tỷ lệ cổ phiếu ESOP lớn hơn đáng kể so với nhân viên cấp dưới. Trong một số trường hợp, toàn bộ cổ phiếu ESOP chỉ được phân bổ cho ban lãnh đạo công ty, khiến chương trình mất đi vai trò gắn kết đội ngũ nhân viên rộng hơn. Khác với <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/co-tuc-la-gi\">cổ tức tiền mặt<\/a> chia đều theo tỷ lệ sở hữu, ESOP chỉ đến tay nhóm người lao động được chọn.<\/p>", "links": [{"to": "co-tuc-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/co-tuc-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "hub · đoạn i=31"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "gia-tri-doanh-nghiep-la-gi", "title": "Giá trị doanh nghiệp là gì? 5 cách định giá doanh nghiệp", "url": "https://www.dsc.com.vn/kien-thuc/gia-tri-doanh-nghiep-la-gi", "clicks": 6, "pri": "P1", "group": ["cluster"], "items": [{"pos": "Phương pháp P/E: Định giá theo thu nhập trên mỗi cổ phiếu", "before": "<p>Phương pháp P/E phát huy hiệu quả tối đa với các doanh nghiệp có lợi nhuận tăng trưởng đều. Bạn không nên áp dụng P/E đơn lẻ cho các ngành mang tính chu kỳ cao như thép hay phân bón.<\/p>", "after": "<p>Phương pháp P/E phát huy hiệu quả tối đa với các doanh nghiệp có lợi nhuận tăng trưởng đều. Bạn không nên áp dụng P/E đơn lẻ cho các ngành mang tính chu kỳ cao như thép hay phân bón. Với nhóm chu kỳ, <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a> hay kết hợp P/B hoặc EV/EBITDA để tránh định giá sai ở đỉnh lợi nhuận.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "pillar · đoạn i=40"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "co-cau-von-capital-structure-la-gi-cach-ap-dung-vao-phan-tich-co-ban-co-phieu", "title": "Cơ cấu vốn (capital structure) là gì? Thông tin chi tiết A - Z", "url": "https://www.dsc.com.vn/kien-thuc/co-cau-von-capital-structure-la-gi-cach-ap-dung-vao-phan-tich-co-ban-co-phieu", "clicks": 0, "pri": "P1", "group": ["cluster"], "items": [{"pos": "Cơ cấu vốn (capital structure) là gì?", "before": "<p>Cơ cấu vốn (capital structure) là tỷ lệ giữa vốn vay và vốn chủ sở hữu được sử dụng để tài trợ cho tài sản của doanh nghiệp. Vốn vay bao gồm các khoản nợ ngắn hạn và dài hạn, còn vốn chủ sở hữu bao gồm vốn cổ phần phổ thông, vốn cổ phần ưu đãi, lợi nhuận chưa phân phối,...<\/p>", "after": "<p>Cơ cấu vốn (capital structure) là tỷ lệ giữa vốn vay và vốn chủ sở hữu được sử dụng để tài trợ cho tài sản của doanh nghiệp. Vốn vay bao gồm các khoản nợ ngắn hạn và dài hạn, còn vốn chủ sở hữu bao gồm vốn cổ phần phổ thông, vốn cổ phần ưu đãi, lợi nhuận chưa phân phối,... Tỷ trọng vốn vay càng cao thì mức <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/don-bay-tai-chinh-la-gi-uu-va-nhuoc-diem-cach-su-dung\">đòn bẩy tài chính<\/a> càng lớn, kéo theo cả lợi nhuận kỳ vọng lẫn rủi ro.<\/p>", "links": [{"to": "don-bay-tai-chinh-la-gi-uu-va-nhuoc-diem-cach-su-dung", "url": "https://www.dsc.com.vn/kien-thuc/don-bay-tai-chinh-la-gi-uu-va-nhuoc-diem-cach-su-dung", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "sub-hub · đoạn i=2"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "ty-le-no-dai-han-tren-von-chu-so-huu-la-gi", "title": "Tỷ lệ nợ dài hạn trên vốn chủ sở hữu là gì? Cách tính và ý nghĩa", "url": "https://www.dsc.com.vn/kien-thuc/ty-le-no-dai-han-tren-von-chu-so-huu-la-gi", "clicks": 9, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Tỷ lệ nợ dài hạn trên vốn chủ sở hữu là gì?", "before": "<p>Tỷ lệ nợ dài hạn trên vốn chủ sở hữu (Long-term Debt to Equity Ratio) là chỉ số cho biết mức độ doanh nghiệp sử dụng nợ dài hạn so với vốn chủ sở hữu để tài trợ cho hoạt động. Chỉ số này phản ánh doanh nghiệp phụ thuộc vào nợ vay dài hạn nhiều hay ít trong cơ cấu tài chính.<\/p>", "after": "<p>Tỷ lệ nợ dài hạn trên vốn chủ sở hữu (Long-term Debt to Equity Ratio) là chỉ số cho biết mức độ doanh nghiệp sử dụng nợ dài hạn so với vốn chủ sở hữu để tài trợ cho hoạt động. Chỉ số này phản ánh doanh nghiệp phụ thuộc vào nợ vay dài hạn  phiếu thưởng nhằm mục đích đa chiều và có lợi ích dài hạn cho cả công ty và cổ đông. Cổ phiếu thưởng là cổ phần phổ thông, khác với <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/so-sanh-co-phieu-thuong-va-co-phieu-uu-dai\">cổ phần ưu đãi<\/a> có quyền lợi riêng về cổ tức hoặc biểu quyết.<\/p>", "links": [{"to": "so-sanh-co-phieu-thuong-va-co-phieu-uu-dai", "url": "https://www.dsc.com.vn/kien-thuc/so-sanh-co-phieu-thuong-va-co-phieu-uu-dai", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=4"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Cổ phiếu thưởng là gì?", "before": "<p>Việc phát hành cổ phiếu thưởng cũng có thể tăng cường thanh khoản cho cổ phiếu của công ty. Khi số lượng cổ phiếu lưu hành tăng lên, có thêm cơ hội giao dịch, và do đó, tăng khả năng mua bán cổ phiếu trên thị trường.<\/p>", "after": "<p>Việc phát hành cổ phiếu thưởng cũng có thể tăng cường thanh khoản cho cổ phiếu của công ty. Khi số lượng cổ phiếu lưu hành tăng lên, có thêm cơ hội giao dịch, và do đó, tăng khả năng mua bán cổ phiếu trên thị trường. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, cổ phiếu thưởng không làm tăng giá trị doanh nghiệp, chỉ chia giá trị đó cho nhiều cổ phần hơn.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=8"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "gia-tri-noi-tai-cua-co-phieu-la-gi-cach-tinh-gia-tri-noi-tai-cua-co-phieu", "title": "Giá trị nội tại của cổ phiếu là gì? 4 cách định giá chuẩn 2026", "url": "https://www.dsc.com.vn/kien-thuc/gia-tri-noi-tai-cua-co-phieu-la-gi-cach-tinh-gia-tri-noi-tai-cua-co-phieu", "clicks": 5, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Giá trị nội tại của cổ phiếu là gì? Phân biệt với thị giá", "before": "<p>Trong trường phái <a target=\"  "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=5"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "cach-dinh-gia-co-phieu-cho-nguoi-moi-bat-dau", "title": "4 cách định giá cổ phiếu hiệu quả cho người mới bắt đầu", "url": "https://www.dsc.com.vn/kien-thuc/cach-dinh-gia-co-phieu-cho-nguoi-moi-bat-dau", "clicks": 4, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Phương pháp định giá cổ phiếu theo chiết khấu cổ tức (DCF)", "before": "<p><strong>Cách áp dụng: <\/strong>Dù công thức có vẻ phức tạp, bạn có thể hiểu đơn giản rằng phương pháp này đòi hỏi phải ước tính khả năng tạo tiền của công ty trong nhiều năm tới. Đây là phương pháp toàn diện nhất nhưng kết quả phụ thuộc nhiều vào các giả định của người phân tích (tốc độ tăng trưởng, tỷ lệ chiết khấu).<\/p>", "after": "<p><strong>Cách áp dụng: <\/strong>Dù công thức có vẻ phức tạp, bạn có thể hiểu đơn giản rằng phương pháp này đòi hỏi phải ước tính khả năng tạo tiền của công ty trong nhiều năm tới. Đây là phương pháp toàn diện nhất nhưng kết quả phụ thuộc nhiều vào các giả định của người phân tích (tốc độ tăng trưởng, tỷ lệ chiết khấu). Đây là phương pháp gắn chặt nhất với <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, vì mọi giả định đều đến từ đánh giá ngành và doanh nghiệp.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=16"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "bang-can-doi-ke-toan-va-cach-ap-dung-vao-dau-tu-chung-khoan", "title": "Bảng cân đối kế toán là gì? Cách áp dụng đầu tư chứng khoán", "url": "https://www.dsc.com.vn/kien-thuc/bang-can-doi-ke-toan-va-cach-ap-dung-vao-dau-tu-chung-khoan", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Đánh giá sức khỏe tài chính của doanh nghiệp", "before": "<p>Bảng cân đối kế toán cung cấp cho nhà đầu tư cái nhìn tổng quan về tình hình tài chính của doanh nghiệp, bao gồm quy mô, cơ cấu tài sản, nguồn vốn, khả năng thanh toán,... Từ đó, nhà đầu tư có thể đánh giá sức khỏe tài chính của doanh nghiệp, xác định xem doanh nghiệp có đang hoạt động hiệu quả hay không.<\/p>", "after": "<p>Bảng cân đối kế toán cung cấp cho nhà đầu tư cái nhìn tổng quan về tình hình tài chính của doanh nghiệp, bao gồm quy mô, cơ cấu tài sản, nguồn vốn, khả năng thanh toán,... Từ đó, nhà đầu tư có thể đánh giá sức khỏe tài chính của doanh nghiệp, xác định xem doanh nghiệp có đang hoạt động hiệu quả hay không. Đây là điểm xuất phát khi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-phan-tich-bao-cao-tai-chinh\">phân tích báo cáo tài chính<\/a>, trước khi chuyển sang báo cáo kết quả kinh doanh và lưu chuyển tiền tệ.<\/p>", "links": [{"to": "cach-phan-tich-bao-cao-tai-chinh", "url": "https://www.dsc.com.vn/kien-thuc/cach-phan-tich-bao-cao-tai-chinh", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=46"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Xác định xu hướng phát triển của doanh nghiệp", "before": "<p>Bằng cách so sánh bảng cân đối kế toán của các kỳ báo cáo khác nhau, nhà đầu tư có thể xác định xu hướng phát triển của doanh nghiệp. Nếu tài sản, vốn chủ sở hữu,... của doanh nghiệp tăng lên theo thời gian, điều này cho thấy doanh nghiệp đang phát triển tốt.<\/p>", "after": "<p>Bằng cách so sánh bảng cân đối kế toán của các kỳ báo cáo khác nhau, nhà đầu tư có thể xác định xu hướng phát triển của doanh nghiệp. Nếu tài sản, vốn chủ sở hữu,... của doanh nghiệp tăng lên theo thời gian, điều này cho thấy doanh nghiệp đang phát triển tốt. Muốn so sánh đúng giữa các kỳ, nhà đầu tư cần nắm <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong\">cách đọc báo cáo tài chính<\/a> theo từng khoản mục tài sản và nguồn vốn.<\/p>", "links": [{"to": "huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong", "url": "https://www.dsc.com.vn/kien-thuc/huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=48"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Xác định xu hướng phát triển của doanh nghiệp", "before": "<p>Ngược lại, nếu tài sản, vốn chủ sở hữu,... của doanh nghiệp giảm xuống theo thời gian, điều này cho thấy doanh nghiệp đang gặp khó khăn.<\/p>", "after": "<p>Ngược lại, nếu tài sản, vốn chủ sở hữu,... của doanh nghiệp giảm xuống theo thời gian, điều này cho thấy doanh nghiệp đang gặp khó khăn. Vì vậy, <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a> luôn đọc bảng cân đối qua nhiều kỳ thay vì một thời điểm.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=49"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "bao-cao-lai-lo-la-gi", "title": "Báo cáo lãi lỗ là gì? Cấu trúc và cách phân tích cho F0", "url": "https://www.dsc.com.vn/kien-thuc/bao-cao-lai-lo-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Báo cáo lãi lỗ là gì?", "before": "<p>Báo cáo lãi lỗ (Profit and Loss Statement - P&amp;L) có tên kế toán chính thức tại Việt Nam là Báo cáo kết quả hoạt động kinh doanh. Tài liệu này tổng hợp toàn bộ doanh thu phát sinh và chi phí tiêu tốn của doanh nghiệp trong một kỳ kế toán.<\/p>", "after": "<p>Báo cáo lãi lỗ (Profit and Loss Statement - P&amp;L) có tên kế toán chính thức tại Việt Nam là Báo cáo kết quả hoạt động kinh doanh. Tài liệu này tổng hợp toàn bộ doanh thu phát sinh và chi phí tiêu tốn của doanh nghiệp trong một kỳ kế toán. Đây là một trong ba báo cáo chính khi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-phan-tich-bao-cao-tai-chinh\">phân tích báo cáo tài chính<\/a>, cùng bảng cân đối kế toán và báo cáo lưu chuyển tiền tệ.<\/p>", "links": [{"to": "cach-phan-tich-bao-cao-tai-chinh", "url": "https://www.dsc.com.vn/kien-thuc/cach-phan-tich-bao-cao-tai-chinh", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=2"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Báo cáo lãi lỗ là gì?", "before": "<p>Đối với nhà đầu tư chứng khoán, báo cáo lãi lỗ giúp đánh giá khả năng sinh lời thực tế của doanh nghiệp. Thông qua các con số, bạn có thể nhận biết doanh nghiệp đang mở rộng thị phần hay đang gặp áp lực chi phí.<\/p>", "after": "<p>Đối với nhà đầu tư chứng khoán, báo cáo lãi lỗ giúp đánh giá khả năng sinh lời thực tế của doanh nghiệp. Thông qua các con số, bạn có thể nhận biết doanh nghiệp đang mở rộng thị phần hay đang gặp áp lực chi phí. Đây là báo cáo được dùng nhiều nhất trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, vì phần lớn chỉ số sinh lời lấy số liệu từ đây.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=4"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Bước 1: So sánh tăng trưởng doanh thu và lợi nhuận", "before": "<p>Nếu lợi nhuận sau thuế tăng mạnh nhưng doanh thu thuần lại đi ngang hoặc giảm, bạn cần đặt câu hỏi nghi vấn. Doanh nghiệp có thể đang cắt giảm chi phí quá đà hoặc ghi nhận các khoản thu nhập ngắn hạn không bền vững.<\/p>", "after": "<p>Nếu lợi nhuận sau thuế tăng mạnh nhưng doanh thu thuần lại đi ngang hoặc giảm, bạn cần đặt câu hỏi nghi vấn. Doanh nghiệp có thể đang cắt giảm chi phí quá đà hoặc ghi nhận các khoản thu nhập ngắn hạn không bền vững. Trường hợp này cần <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong\">đọc báo cáo tài chính<\/a> phần thuyết minh để tìm nguồn của khoản lợi nhuận bất thường.<\/p>", "links": [{"to": "huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong", "url": "https://www.dsc.com.vn/kien-thuc/huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=47"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "bao-cao-luu-chuyen-tien-te-la-gi", "title": "Báo cáo lưu chuyển tiền tệ là gì? Ý nghĩa và cách đọc", "url": "https://www.dsc.com.vn/kien-thuc/bao-cao-luu-chuyen-tien-te-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Báo cáo lưu chuyển tiền tệ là gì?", "before": "<p>Theo quy định tại <a target=\"_blank\" href=\"https://vanban.chinhphu.vn/default.aspx?pageid=27160&amp;docid=188744\" rel=\"nofollow\"><strong>Nghị định 25/2017/NĐ-CP<\/strong><\/a>, báo cáo lưu chuyển tiền tệ (Cash Flow Statement) là một trong bốn <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong\"><strong>báo cáo tài chính cơ bản<\/strong><\/a> và quan trọng nhất của doanh nghiệp. Nó phản ánh chi tiết dòng tiền vào (thu) và dòng tiền ra (chi) trong một kỳ kế toán.<\/p>", "after": "<p>Theo quy định tại <a target=\"_blank\" href=\"https://vanban.chinhphu.vn/default.aspx?pageid=27160&amp;docid=188744\" rel=\"nofollow\"><strong>Nghị định 25/2017/NĐ-CP<\/strong><\/a>, báo cáo lưu chuyển tiền tệ (Cash Flow Statement) là một trong bốn <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong\"><strong>báo cáo tài chính cơ bản<\/strong><\/a> và quan trọng nhất của doanh nghiệp. Nó phản ánh chi tiết dòng tiền vào (thu) và dòng tiền ra (chi) trong một kỳ kế toán. Đây là báo cáo hay bị bỏ qua nhất khi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-p /kien-thuc/chi-so-eps-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Phân loại các chỉ số EPS trong phân tích tài chính", "before": "<p>Trong báo cáo kết quả kinh doanh, chỉ số EPS thường được trình bày dưới hai hình thức: <strong>EPS cơ bản<\/strong> và <strong>EPS pha loãng<\/strong>. Việc phân biệt rõ hai loại chỉ số này giúp nhà đầu tư đánh giá chính xác thực trạng lợi nhuận và các rủi ro tiềm ẩn trong tương lai.<\/p>", "after": "<p>Trong báo cáo kết quả kinh doanh, chỉ số EPS thường được trình bày dưới hai hình thức: <strong>EPS cơ bản<\/strong> và <strong>EPS pha loãng<\/strong>. Việc phân biệt rõ hai loại chỉ số này giúp nhà đầu tư đánh giá chính xác thực trạng lợi nhuận và các rủi ro tiềm ẩn trong tương lai. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, EPS pha loãng là con số an toàn hơn khi doanh nghiệp có trái phiếu chuyển đổi hoặc ESOP.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=10"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-so-npv-la-gi", "title": "Chỉ số NPV là gì? Cách tính, ý nghĩa và ứng dụng đầu tư", "url": "https://www.dsc.com.vn/kien-thuc/chi-so-npv-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Chỉ số NPV là gì?", "before": "<p>Cơ sở cốt lõi của NPV đến từ một khái niệm nền tảng trong tài chính: giá trị thời gian của tiền. Một đồng bạn nhận được hôm nay luôn có giá trị hơn một đồng bạn sẽ nhận được trong tương lai, do các yếu tố như lạm phát và chi phí cơ hội. Do đó, để đánh giá chính xác, phương pháp NPV sẽ quy đổi (hay chiết khấu) tất cả các dòng tiền trong tương lai về giá trị ở thời điểm hiện tại, sau đó mới so sánh với số vốn bỏ ra ban đầu.<\/p>", "after": "<p>Cơ sở cốt lõi của NPV đến từ một khái niệm nền tảng trong tài chính: giá trị thời gian của tiền. Một đồng bạn nhận được hôm nay luôn có giá trị hơn một đồng bạn sẽ nhận được trong tương lai, do các yếu tố như lạm phát và chi phí cơ hội. Do đó, để đánh giá chính xác, phương pháp NPV sẽ quy đổi (hay chiết khấu) tất cả các dòng tiền trong tương lai về giá trị ở thời điểm hiện tại, sau đó mới so sánh với số vốn bỏ ra ban đầu. Nguyên lý giá trị thời gian của tiền cũng là nền của các mô hình định giá trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=3"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-so-p-e-la-gi-cach-ap-dung-de-tim-co-phieu-tot", "title": "Chỉ số P/E là gì? Công thức và ứng dụng đầu tư chứng khoán", "url": "https://www.dsc.com.vn/kien-thuc/chi-so-p-e-la-gi-cach-ap-dung-de-tim-co-phieu-tot", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Chỉ số P/E là gì?", "before": "<p>Về bản chất, chỉ số P/E thể hiện mức giá mà bạn chấp nhận bỏ ra để thu về một đồng lợi nhuận từ cổ phiếu đó.<\/p>", "after": "<p>Về bản chất, chỉ số P/E thể hiện mức giá mà bạn chấp nhận bỏ ra để thu về một đồng lợi nhuận từ cổ phiếu đó. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, P/E chỉ có nghĩa khi đặt cạnh tốc độ tăng trưởng lợi nhuận và P/E trung bình ngành.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=10"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-so-p-s-la-gi", "title": "Chỉ số P/S là gì? Công thức, ý nghĩa và cách ứng dụng 2026", "url": "https://www.dsc.com.vn/kien-thuc/chi-so-p-s-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Đánh giá cổ phiếu khi P/E không thể áp dụng (Doanh nghiệp báo lỗ)", "before": "<p>Khi doanh nghiệp tạm thời báo lỗ do chi phí tài chính tăng cao hoặc đang trong giai đoạn mở rộng quy mô, chỉ số P/E sẽ bị âm và không có giá trị so sánh. Trong bối cảnh đó, doanh thu thuần vẫn là con số dương phản ánh hoạt động bán hàng thực tế.<\/p>", "after": "<p>Khi doanh nghiệp tạm thời báo lỗ do chi phí tài chính tăng cao hoặc đang trong giai đoạn mở rộng quy mô, chỉ số P/E sẽ bị âm và không có giá trị so sánh. Trong bối cảnh đó, doanh thu thuần vẫn là con số dương phản ánh hoạt động bán hàng thực tế. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, P/S vì vậy là chỉ số thay thế khi lợi nhuận chưa phản ánh đúng quy mô kinh doanh.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=16"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Đánh giá cổ phiếu khi P/E không thể áp dụng (Doanh nghiệp báo lỗ)", "before": "<p>Chỉ số P/S giúp nhà đầu tư định giá chính xác các doanh nghiệp tăng trưởng nhanh hoặc các công ty tái cấu trúc trước khi lợi nhuận ròng quay trở lại mức dương.<\/p>", "after": "<p>Chỉ số P/S giúp nhà đầu tư định giá chính xác các doanh nghiệp tăng trưởng nhanh hoặc các công ty tái cấu trúc trước khi lợi nhuận ròng quay trở lại mức dương. P/S cần dùng cùng các <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-dinh-gia-co-phieu-cho-nguoi-moi-bat-dau\">phương pháp định giá cổ phiếu<\/a> khác vì chỉ số này bỏ qua biên lợi nhuận.<\/p>", "links": [{"to": "cach-dinh-gia-co-phieu-cho-nguoi-moi-bat-dau", "url": "https://www.dsc.com.vn/kien-thuc/cach-dinh-gia-co-phieu-cho-nguoi-moi-bat-dau", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=17"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-so-q-o-q-la-gi", "title": "Chỉ số QoQ là gì? Ý nghĩa và cách ứng dụng trong đọc báo cáo tài chính", "url": "https://www.dsc.com.vn/kien-thuc/chi-so-q-o-q-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Khái niệm chỉ số QoQ là gì?", "before": "<p>Việc theo dõi chỉ số QoQ giúp nhà đầu tư cập nhật liên tục sức khỏe tài chính doanh nghiệp 3 tháng một lần. Điều này mang lại lợi thế phản ứng nhanh trước các chuyển biến mới của hoạt động kinh doanh.<\/p>", "after": "<p>Việc theo dõi chỉ số QoQ giúp nhà đầu tư cập nhật liên tục sức khỏe tài chính doanh nghiệp 3 tháng một lần. Điều này mang lại lợi thế phản ứng nhanh trước các chuyển biến mới của hoạt động kinh doanh. Các <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chi-tieu-loi-nhuan-cua-doanh-nghiep\">chỉ tiêu lợi nhuận<\/a> hay được theo dõi theo QoQ là lợi nhuận gộp, lợi nhuận hoạt động và lợi nhuận sau thuế.<\/p>", "links": [{"to": "chi-tieu-loi-nhuan-cua-doanh-nghiep", "url": "https://www.dsc.com.vn/kien-thuc/chi-tieu-loi-nhuan-cua-doanh-nghiep", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=4"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Ý nghĩa của chỉ số QoQ trong phân tích báo cáo tài chính", "before": "<p>Chỉ số QoQ giữ vai trò là hồi chuông cảnh báo sớm cho nhà đầu tư khi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-bao-cao-tai-chinh-vietcombank-vcb\"><strong>phân tích báo cáo tài chính<\/strong><\/a>. Chỉ số này giúp xác định đà tăng tốc hoặc sự chững lại của doanh nghiệp trước khi số liệu YoY thể hiện.<\/p>", "after": "<p>Chỉ số QoQ giữ vai trò là hồi chuông cảnh báo sớm cho nhà đầu tư khi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-bao-cao-tai-chinh-vietcombank-vcb\"><strong>phân tích báo cáo tài chính<\/strong><\/a>. Chỉ số này giúp xác định đà tăng tốc hoặc sự chững lại của doanh nghiệp trước khi số liệu YoY thể hiện. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, QoQ và YoY cần đọc cùng nhau để tách xu hướng thật khỏi yếu tố mùa vụ.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=26"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Ý nghĩa của chỉ số QoQ trong phân tích báo cáo tài chính", "before": "<p>Trường hợp doanh nghiệp bị ảnh hưởng nặng bởi suy thoái, số liệu YoY thường mất nhiều thời gian để đảo chiều dương do nền so sánh năm trước quá cao. Khi đó, tăng trưởng QoQ dương liên tiếp là bằng chứng xác thực cho thấy doanh nghiệp đã tạo đáy kinh doanh.<\/p>", "after": "<p>Trường hợp doanh nghiệp bị ảnh hưởng nặng bởi suy thoái, số liệu YoY thường mất nhiều thời gian để đảo chiều dương do nền so sánh năm trước quá cao. Khi đó, tăng trưởng QoQ dương liên tiếp là bằng chứng xác thực cho thấy doanh nghiệp đã tạo đáy kinh doanh. Đây là cách <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-phan-tich-bao-cao-tai-chinh\">phân tích báo cáo tài chính<\/a> theo quý giúp phát hiện điểm đảo chiều sớm hơn so với chỉ nhìn số năm.<\/p>", "links": [{"to": "cach-phan-tich-bao-cao-tai-chinh", "url": "https://www.dsc.com.vn/kien-thuc/cach-phan-tich-bao-cao-tai-chinh", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=28"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-so-roa-la-gi-y-nghia-va-cach-su-dung", "title": "Chỉ số ROA là gì? Cách tính, ý nghĩa và ứng dụng ROA", "url": "https://www.dsc.com.vn/kien-thuc/chi-so-roa-la-gi-y-nghia-va-cach-su-dung", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Chỉ số ROA là gì?", "before": "<p>Tài sản của doanh nghiệp được hình thành từ vốn chủ sở hữu và nợ phải trả. Do đó, ROA đo lường tổng thể hiệu quả quản trị của ban lãnh đạo trong việc sử dụng hai nguồn vốn này.<\/p>", "after": "<p>Tài sản của doanh nghiệp được hình thà  "P2", "group": ["cluster"], "items": [{"pos": "Chỉ số ROE là gì?", "before": "<p>Cụ thể hơn, ROE cho biết cứ mỗi 100 đồng vốn chủ sở hữu, doanh nghiệp có thể sinh ra bao nhiêu đồng lợi nhuận sau thuế. Đây không chỉ là con số phản ánh hiệu quả kinh doanh, mà còn thể hiện năng lực sử dụng vốn của ban lãnh đạo.<\/p>", "after": "<p>Cụ thể hơn, ROE cho biết cứ mỗi 100 đồng vốn chủ sở hữu, doanh nghiệp có thể sinh ra bao nhiêu đồng lợi nhuận sau thuế. Đây không chỉ là con số phản ánh hiệu quả kinh doanh, mà còn thể hiện năng lực sử dụng vốn của ban lãnh đạo. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, ROE cần so với trung bình ngành và đọc cùng mức nợ vay.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=7"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-so-roic-la-gi", "title": "Chỉ số ROIC là gì? Công thức và ý nghĩa chỉ số ROIC", "url": "https://www.dsc.com.vn/kien-thuc/chi-so-roic-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Chỉ số ROIC là gì?", "before": "<p>Nói cách khác, chỉ số ROIC cho biết cứ mỗi đồng vốn mà doanh nghiệp huy động được và đưa vào hoạt động kinh doanh, thì doanh nghiệp đó tạo ra được bao nhiêu đồng lợi nhuận. Chỉ số này đặc biệt hữu ích khi so sánh hiệu suất giữa các công ty trong cùng ngành, hoặc đánh giá hiệu quả đầu tư của chính doanh nghiệp đó qua từng giai đoạn.<\/p>", "after": "<p>Nói cách khác, chỉ số ROIC cho biết cứ mỗi đồng vốn mà doanh nghiệp huy động được và đưa vào hoạt động kinh doanh, thì doanh nghiệp đó tạo ra được bao nhiêu đồng lợi nhuận. Chỉ số này đặc biệt hữu ích khi so sánh hiệu suất giữa các công ty trong cùng ngành, hoặc đánh giá hiệu quả đầu tư của chính doanh nghiệp đó qua từng giai đoạn. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, ROIC duy trì cao hơn chi phí vốn qua nhiều năm là dấu hiệu doanh nghiệp có lợi thế cạnh tranh bền.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=3"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-so-ros-la-gi", "title": "Chỉ số ROS là gì? Công thức tính & Cách ứng dụng", "url": "https://www.dsc.com.vn/kien-thuc/chi-so-ros-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Cảnh báo bẫy tài chính: ROS cao đột biến do thu nhập tài chính", "before": "<p>Nhà đầu tư cần đề phòng trường hợp doanh nghiệp có chỉ số ROS cao bất thường nhưng dòng tiền từ hoạt động kinh doanh âm. Điều này xảy ra khi lợi nhuận chủ yếu đến từ hoạt động tài chính hoặc thanh lý tài sản. Đây là nguồn thu không bền vững và không phản ánh năng lực kinh doanh cốt lõi.<\/p>", "after": "<p>Nhà đầu tư cần đề phòng trường hợp doanh nghiệp có chỉ số ROS cao bất thường nhưng dòng tiền từ hoạt động kinh doanh âm. Điều này xảy ra khi lợi nhuận chủ yếu đến từ hoạt động tài chính hoặc thanh lý tài sản. Đây là nguồn thu không bền vững và không phản ánh năng lực kinh doanh cốt lõi. Vì vậy, ROS cần đọc cùng các <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-chi-so-phan-tich-bao-cao-tai-chinh\">chỉ số tài chính<\/a> về dòng tiền thay vì đứng riêng.<\/p>", "links": [{"to": "cac-chi-so-phan-tich-bao-cao-tai-chinh", "url": "https://www.dsc.com.vn/kien-thuc/cac-chi-so-phan-tich-bao-cao-tai-chinh", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=58"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chia-tach-co-phieu-la-gi-muc-dich-cua-viec-chia-tach-co-phieu", "title": "Chia tách cổ phiếu là gì? Mục đích của việc chia tách cổ phiếu", "url": "https://www.dsc.com.vn/kien-thuc/chia-tach-co-phieu-la-gi-muc-dich-cua-viec-chia-tach-co-phieu", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Chia tách cổ phiếu là gì?", "before": "<p>Chia tách cổ phiếu là hoạt động tăng số lượng cổ phiếu lưu hành của một công ty niêm yết theo một tỷ lệ quy định mà không làm tăng vốn cổ phần của công ty và không làm thay đổi tỷ lệ nắm giữ của cổ đông.<\/p>", "after": "<p>Chia tách cổ phiếu là hoạt động tăng số lượng cổ phiếu lưu hành của một công ty niêm yết theo một tỷ lệ quy định mà không làm tăng vốn cổ phần của công ty và không làm thay đổi tỷ lệ nắm giữ của cổ đông. Hoạt động này áp dụng cho cổ phiếu phổ thông và không làm thay đổi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/so-sanh-co-phieu-thuong-va-co-phieu-uu-dai\">loại cổ phần<\/a> mà cổ đông đang nắm giữ.<\/p>", "links": [{"to": "so-sanh-co-phieu-thuong-va-co-phieu-uu-dai", "url": "https://www.dsc.com.vn/kien-thuc/so-sanh-co-phieu-thuong-va-co-phieu-uu-dai", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=1"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Tác động của chia tách cổ phiếu đến giá cổ phiếu", "before": "<p>Tuy nhiên, không phải lúc nào chia tách cổ phiếu cũng làm tăng giá cổ phiếu. Có một số trường hợp, giá cổ phiếu sau khi chia tách có thể giảm, chẳng hạn như khi thị trường chứng khoán đang trong giai đoạn giảm điểm.<\/p>", "after": "<p>Tuy nhiên, không phải lúc nào chia tách cổ phiếu cũng làm tăng giá cổ phiếu. Có một số trường hợp, giá cổ phiếu sau khi chia tách có thể giảm, chẳng hạn như khi thị trường chứng khoán đang trong giai đoạn giảm điểm. Với <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, chia tách không thay đổi giá trị doanh nghiệp, nên EPS và giá mục tiêu chỉ cần điều chỉnh theo tỷ lệ.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=26"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "co-phieu-bi-huy-niem-yet-nha-dau-tu-can-luu-y-nhung-gi", "title": "Cổ phiếu bị hủy niêm yết là gì? Nhà đầu tư phải làm sao?", "url": "https://www.dsc.com.vn/kien-thuc/co-phieu-bi-huy-niem-yet-nha-dau-tu-can-luu-y-nhung-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Hủy niêm yết bắt buộc (Mandatory Delisting)", "before": "<p>Đây là trường hợp cổ phiếu bị Sở Giao dịch Chứng khoán buộc phải rời sàn do không còn đáp ứng đủ các tiêu chuẩn niêm yết theo quy định tại <strong>Nghị định 155/2020/NĐ-CP<\/strong>.<\/p>", "after": "<p>Đây là trường hợp cổ phiếu bị Sở Giao dịch Chứng khoán buộc phải rời sàn do không còn đáp ứng đủ các tiêu chuẩn niêm yết theo quy định tại <strong>Nghị định 155/2020/NĐ-CP<\/strong>. Các tiêu chuẩn đó chính là <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/niem-yet-chung-khoan-ipo-la-gi-nhung-dieu-can-biet\">điều kiện niêm yết chứng khoán<\/a> mà doanh nghiệp đã phải đáp ứng khi lên sàn.<\/p>", "links": [{"to": "niem-yet-chung-khoan-ipo-la-gi-nhung-dieu-can-biet", "url": "https://www.dsc.com.vn/kien-thuc/niem-yet-chung-khoan-ipo-la-gi-nhung-dieu-can-biet", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=17"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Cổ phiếu bị hủy niêm yết có mất tiền không?", "before": "<p>Sau khi bị hủy niêm yết, cổ phiếu có thể được chuyển sang giao dịch trên UPCoM hoặc chỉ mua bán ngoài sàn. Ở những thị trường này, thanh khoản thường rất thấp, giá cổ phiếu dễ giảm sâu so với thời điểm còn niêm yết, thậm chí khó tìm được người mua. Mức độ thiệt hại thực tế của nhà đầu tư sẽ phụ thuộc vào tình hình tài chính và triển vọng hoạt động của doanh nghiệp sau khi bị hủy niêm yết.<\/p>", "after": "<p>Sau khi bị hủy niêm yết, cổ phiếu có thể được chuyển sang giao dịch trên UPCoM hoặc chỉ mua bán ngoài sàn. Ở những thị trường này, thanh khoản thường rất thấp, giá cổ phiếu dễ giảm sâu so với thời điểm còn niêm yết, thậm chí khó tìm được người mua. Mức độ thiệt hại thực tế của nhà đầu tư sẽ phụ thuộc vào tình hình tài chính và triển vọng hoạt động của doanh nghiệp sau khi bị hủy niêm yết. Vì vậy, <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a> cần kiểm tra lịch sử kiểm toán và công bố thông tin trước khi mua cổ phiếu nhỏ.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=37"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "co-phieu-quy-la-gi", "title": "Cổ phiếu quỹ là gì? Đặc điểm của cổ phiếu quỹ", "url": "https://www.dsc.com.vn/kien-thuc/co-phieu-quy-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Cổ phiếu quỹ là gì?", "before": "<p><a target=\"_blank\" href=\"https://en.wikipedia.org/wiki/Treasury_stock\" rel=\"nofollow\"><strong>Cổ phiếu quỹ<\/strong><\/a> là cổ phiếu do chính doanh nghiệp phát hành mua lại từ thị trường thứ cấp bằng nguồn vốn hợp pháp. Sau khi được mua lại, số cổ phiếu này không còn được tính vào tổng lượng cổ phiếu đang lưu hành, đồng nghĩa với việc quyền biểu quyết và quyền nhận cổ tức gắn với số cổ phiếu đó bị tạm ngưng trong thời gian doanh nghiệp nắm giữ.<\/p>", "after": "<p><a target=\"_blank\" href=\"https://en.wikipedia.org/wiki/Treasury_stock\" rel=\"nofollow\"><strong>Cổ phiếu quỹ<\/strong><\/a> là cổ phiếu do chính doanh nghiệp phát hành mua lại từ thị trường thứ cấp bằng nguồn vốn hợp pháp. Sau khi được mua lại, số cổ phiếu này không còn được tính vào tổng lượng cổ phiếu đang lưu hành, đồng nghĩa với việc quyền biểu quyết và quyền nhận cổ tức gắn với số cổ phiếu đó bị tạm ngưng trong thời gian doanh nghiệp nắm giữ. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, cổ phiếu quỹ cần trừ khỏi số cổ phiếu lưu hành khi tính EPS và giá trị sổ sách.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=3"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Cổ phiếu quỹ là gì?", "before": "<p>Cổ phiếu quỹ khác biệt với cổ phiếu bị hủy niêm yết ở chỗ doanh nghiệp có thể tái phát hành số cổ phiếu này ra thị trường trong tương lai — ví dụ để phục vụ chương trình ESOP hoặc huy động vốn bổ sung — theo quy định của Ủy ban Chứng khoán Nhà nước (UBCKNN).<\/p>", "after": "<p>Cổ phiếu quỹ khác biệt với cổ phiếu bị hủy niêm yết ở chỗ doanh nghiệp có thể tái phát hành số cổ phiếu này ra thị trường trong tương lai — ví dụ để phục vụ chương trình ESOP hoặc huy động vốn bổ sung — theo quy định của Ủy ban Chứng khoán Nhà nước (UBCKNN). Cổ phiếu quỹ vẫn là cổ phiếu phổ thông, khác với <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/so-sanh-co-phieu-thuong-va-co-phieu-uu-dai\">cổ phần ưu đãi<\/a> có quyền lợi riêng ghi trong điều lệ.<\/p>", "links": [{"to": "so-sanh-co-phieu-thuong-va-co-phieu-uu-dai", "url": "https://www.dsc.com.vn/kien-thuc/so-sanh-co-phieu-thuong-va-co-phieu-uu-dai", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=5"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "co-tuc-la-gi", "title": "Cổ tức là gì? Phân loại và cách tính cổ tức chi tiết", "url": "https://www.dsc.com.vn/kien-thuc/co-tuc-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Cách tính tỷ lệ chi trả cổ tức (Dividend Payout Ratio)", "before": "<p>Một tỷ lệ chi trả cổ tức ở mức hợp lý, thường từ 30 đến 50 phần trăm, cho thấy doanh nghiệp cân bằng giữa việc chia sẻ lợi nhuận với cổ đông và giữ lại lợi nhuận để tái đầu tư. Nếu tỷ lệ này quá cao, doanh nghiệp có thể đang thiếu nguồn lực để duy trì tăng trưởng trong tương lai.<\/p>", "after": "<p>Một tỷ lệ chi trả cổ tức ở mức hợp lý, thường từ 30 đến 50 phần trăm, cho thấy doanh nghiệp cân bằng giữa việc chia sẻ lợi nhuận với cổ đông và giữ lại lợi nhuận để tái đầu tư. Nếu tỷ lệ này quá cao, doanh nghiệp có thể đang thiếu nguồn lực để duy trì tăng trưởng trong tương lai. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, tỷ lệ chi trả cần so với tăng trưởng lợi nhuận để biết doanh nghiệp còn dư địa tái đầu tư.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=33"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "current-ratio-la-gi-cach-tinh-va-y-nghia-cua-he-so-nay", "title": "Current ratio là gì? Cách tính và ý nghĩa của hệ số này", "url": "https://www.dsc.com.vn/kien-thuc/current-ratio-la-gi-cach-tinh-va-y-nghia-cua-he-so-nay", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Ý nghĩa của hệ số current ratio là gì?", "before": "<p>Thông thường, một current ratio từ 1,5 đến 2 được coi là lý tưởng. Điều này có nghĩa là doanh nghiệp có đủ tài sản lưu động để thanh toán các khoản nợ ngắn hạn trong vòng 12 tháng với mức an toàn cao.<\/p>", "after": "<p>Thông thường, một current ratio từ 1,5 đến 2 được coi là lý tưởng. Điều này có nghĩa là doanh nghiệp có đủ tài sản lưu động để thanh toán các khoản nợ ngắn hạn trong vòng 12 tháng với mức an toàn cao. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, ngưỡng này cần điều chỉnh theo ngành, vì bán lẻ và sản xuất có chu kỳ vốn lưu động khác nhau.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=19"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "danh-gia-chi-tieu-doanh-thu-cua-doanh-nghiep", "title": "Hướng dẫn cách đánh giá chỉ tiêu doanh thu của doanh nghiệp", "url": "https://www.dsc.com.vn/kien-thuc/danh-gia-chi-tieu-doanh-thu-cua-doanh-nghiep", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Cách đánh giá chỉ tiêu doanh thu trong phân tích doanh nghiệp", "before": "<p dir=\"ltr\">Doanh thu là một trong những chỉ tiêu quan trọng nhất trong phân tích cổ phiếu. Nó cung cấp cho nhà đầu tư thông tin về sự thành công của công ty và có thể được sử dụng để đánh giá khả năng của công ty để tăng trưởng trong tương lai.<\/p>", "after": "<p dir=\"ltr\">Doanh thu là một trong những chỉ tiêu quan trọng nhất trong phân tích cổ phiếu. Nó cung cấp cho nhà đầu tư thông tin về sự thành công của công ty và có thể được sử dụng để đánh giá khả năng của công ty để tăng trưởng trong tương lai. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, doanh thu là điểm bắt đầu trước khi xét tới biên lợi nhuận và dòng tiền.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=26"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Cách đánh giá chỉ tiêu doanh thu trong phân tích doanh nghiệp", "before": "<p dir=\"ltr\">Doanh thu có thể được đánh giá bằng cách so sánh với các chỉ tiêu khác như lợi nhuận, tỷ lệ lãi suất, tỷ lệ phí và tỷ lệ tài sản. Nhà đầu tư cũng có thể so sánh doanh thu của công ty với các công ty cùng lĩnh vực để đánh giá hiệu quả kinh doanh của công ty.<\/p>", "after": "<p dir=\"ltr\">Doanh thu có thể được đánh giá bằng cách so sánh với các chỉ tiêu khác như lợi nhuận, tỷ lệ lãi suất, tỷ lệ phí và tỷ lệ tài sản. Nhà đầu tư cũng có thể so sánh doanh thu của công ty với các công ty cùng lĩnh vực để đánh giá hiệu quả kinh doanh của công ty. Doanh thu tăng chỉ có ý nghĩa khi đi cùng các <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chi-tieu-loi-nhuan-cua-doanh-nghiep\">chỉ tiêu lợi nhuận<\/a> cả .<\/p>", "after": "<p>Điểm hòa vốn (BEP) là trạng thái mà tại đó Tổng doanh thu của doanh nghiệp vừa đủ để bù đắp Tổng chi phí (bao gồm chi phí cố định và chi phí biến đổi). Tại điểm này, doanh nghiệp không có lãi nhưng cũng không bị lỗ (Lợi nhuận = 0). Khi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-phan-tich-bao-cao-tai-chinh\">phân tích báo cáo tài chính<\/a>, điểm hòa vốn giúp ước tính doanh thu tối thiểu mà doanh nghiệp cần trong mỗi quý.<\/p>", "links": [{"to": "cach-phan-tich-bao-cao-tai-chinh", "url": "https://www.dsc.com.vn/kien-thuc/cach-phan-tich-bao-cao-tai-chinh", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=3"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Ví dụ thực tế áp dụng trong đầu tư", "before": "<p>Nếu báo cáo quý của doanh nghiệp cho thấy sản lượng tiêu thụ đạt 45.000 sản phẩm, bạn biết rằng doanh nghiệp vẫn đang lỗ. Nếu dự báo quý sau sản lượng lên 60.000 sản phẩm, đó chính là thời điểm vàng để xem xét giải ngân cổ phiếu.<\/p>", "after": "<p>Nếu báo cáo quý của doanh nghiệp cho thấy sản lượng tiêu thụ đạt 45.000 sản phẩm, bạn biết rằng doanh nghiệp vẫn đang lỗ. Nếu dự báo quý sau sản lượng lên 60.000 sản phẩm, đó chính là thời điểm vàng để xem xét giải ngân cổ phiếu. Vượt điểm hòa vốn, mỗi sản phẩm bán thêm sẽ cải thiện nhanh các <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chi-tieu-loi-nhuan-cua-doanh-nghiep\">chỉ tiêu lợi nhuận<\/a> nhờ chi phí cố định đã được bù.<\/p>", "links": [{"to": "chi-tieu-loi-nhuan-cua-doanh-nghiep", "url": "https://www.dsc.com.vn/kien-thuc/chi-tieu-loi-nhuan-cua-doanh-nghiep", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=49"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "don-bay-tai-chinh-la-gi-uu-va-nhuoc-diem-cach-su-dung", "title": "Đòn bẩy tài chính là gì? Ưu - nhược điểm và cách sử dụng", "url": "https://www.dsc.com.vn/kien-thuc/don-bay-tai-chinh-la-gi-uu-va-nhuoc-diem-cach-su-dung", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Đòn bẩy tài chính là gì?", "before": "<p>Đòn bẩy tài chính (Financial Leverage) là việc sử dụng vốn vay (nợ) để tài trợ cho việc mua tài sản hoặc thực hiện các dự án đầu tư, với kỳ vọng tỷ suất sinh lời trên tài sản cao hơn chi phí lãi vay.<\/p>", "after": "<p>Đòn bẩy tài chính (Financial Leverage) là việc sử dụng vốn vay (nợ) để tài trợ cho việc mua tài sản hoặc thực hiện các dự án đầu tư, với kỳ vọng tỷ suất sinh lời trên tài sản cao hơn chi phí lãi vay. Ở góc độ doanh nghiệp, <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a> đo mức đòn bẩy qua tỷ lệ nợ trên vốn chủ sở hữu và hệ số trả lãi.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=6"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Cách tính đòn bẩy trong đầu tư", "before": "<p>Ví dụ: Với cùng trường hợp trên, hệ số nhân là 200/100 = 2. Điều này có nghĩa là mỗi đồng vốn của bạn đang điều hành 2 đồng tài sản.<\/p>", "after": "<p>Ví dụ: Với cùng trường hợp trên, hệ số nhân là 200/100 = 2. Điều này có nghĩa là mỗi đồng vốn của bạn đang điều hành 2 đồng tài sản. Hệ số nhân này cũng là một thành phần trong nhóm <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-chi-so-phan-tich-bao-cao-tai-chinh\">chỉ số tài chính<\/a> cơ cấu vốn khi tách ROE theo DuPont.<\/p>", "links": [{"to": "cac-chi-so-phan-tich-bao-cao-tai-chinh", "url": "https://www.dsc.com.vn/kien-thuc/cac-chi-so-phan-tich-bao-cao-tai-chinh", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=17"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "dong-tien-tu-hoat-dong-kinh-doanh-ocf-la-gi", "title": "OCF là gì? Tìm hiểu ý nghĩa dòng tiền từ hoạt động kinh doanh", "url": "https://www.dsc.com.vn/kien-thuc/dong-tien-tu-hoat-dong-kinh-doanh-ocf-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Dòng tiền từ hoạt động kinh doanh (OCF) là gì?", "before": "<p>Dòng tiền từ hoạt động kinh doanh (OCF) là số tiền thu vào và chi ra liên quan đến thu nhập và chi phí của doanh nghiệp trong quá trình sản xuất và kinh doanh hàng ngày. OCF dùng để đánh giá khả năng tạo ra tiền mặt của doanh nghiệp từ các hoạt động kinh doanh cốt lõi.<\/p>", "after": "<p>Dòng tiền từ hoạt động kinh doanh (OCF) là số tiền thu vào và chi ra liên quan đến thu nhập và chi phí của doanh nghiệp trong quá trình sản xuất và kinh doanh hàng ngày. OCF dùng để đánh giá khả năng tạo ra tiền mặt của doanh nghiệp từ các hoạt động kinh doanh cốt lõi. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, OCF được so với lợi nhuận sau thuế để kiểm tra chất lượng lợi nhuận.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=2"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Ý nghĩa của dòng tiền từ hoạt động kinh doanh OCF", "before": "<p>OCF dương cho thấy doanh nghiệp đang tạo ra tiền mặt từ hoạt động kinh doanh chính, đây là dấu hiệu tích cực cho thấy doanh nghiệp có khả năng tự trang trải chi phí và đầu tư.<\/p>", "after": "<p>OCF dương cho thấy doanh nghiệp đang tạo ra tiền mặt từ hoạt động kinh doanh chính, đây là dấu hiệu tích cực cho thấy doanh nghiệp có khả năng tự trang trải chi phí và đầu tư. Khi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong\">đọc báo cáo tài chính<\/a>, chỉ tiêu này nằm ở phần đầu báo cáo lưu chuyển tiền tệ.<\/p>", "links": [{"to": "huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong", "url": "https://www.dsc.com.vn/kien-thuc/huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong", "anchor thể áp dụng tư duy thẩm định cẩn trọng này vào quá trình lựa chọn cổ phiếu để tự bảo vệ tài sản của mình. Tư duy này gần với <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-doanh-nghiep-trong-dau-tu-chung-khoan-la-gi\">phân tích doanh nghiệp<\/a> mà nhà đầu tư cá nhân có thể tự làm từ báo cáo tài chính và tài liệu công bố.<\/p>", "links": [{"to": "phan-tich-doanh-nghiep-trong-dau-tu-chung-khoan-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-doanh-nghiep-trong-dau-tu-chung-khoan-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=55"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Phân tích rủi ro pha loãng cổ phiếu", "before": "<p>Nghiên cứu kỹ lịch sử phát hành cổ phiếu của doanh nghiệp. Việc doanh nghiệp liên tục phát hành riêng lẻ (private placement) cho các cổ đông chiến lược với mức giá chiết khấu sâu so với giá thị trường sẽ làm pha loãng nghiêm trọng tỷ lệ sở hữu và chỉ số thu nhập trên mỗi cổ phần (EPS) của các cổ đông nhỏ lẻ.<\/p>", "after": "<p>Nghiên cứu kỹ lịch sử phát hành cổ phiếu của doanh nghiệp. Việc doanh nghiệp liên tục phát hành riêng lẻ (private placement) cho các cổ đông chiến lược với mức giá chiết khấu sâu so với giá thị trường sẽ làm pha loãng nghiêm trọng tỷ lệ sở hữu và chỉ số thu nhập trên mỗi cổ phần (EPS) của các cổ đông nhỏ lẻ. Đây là một trong các bước kiểm tra mà <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản doanh nghiệp<\/a> cần làm trước khi giải ngân.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=70"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "free-float-la-gi", "title": "Free float là gì? Ý nghĩa và vai trò của Free float", "url": "https://www.dsc.com.vn/kien-thuc/free-float-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Free float là gì?", "before": "<p>Free float (tỷ lệ cổ phiếu tự do chuyển nhượng) là tỷ lệ phần trăm số lượng cổ phiếu phổ thông của một công ty niêm yết đang lưu hành có sẵn để giao dịch công khai trên thị trường chứng khoán bởi nhà đầu tư đại chúng, sau khi đã trừ đi số cổ phiếu bị hạn chế chuyển nhượng.<\/p>", "after": "<p>Free float (tỷ lệ cổ phiếu tự do chuyển nhượng) là tỷ lệ phần trăm số lượng cổ phiếu phổ thông của một công ty niêm yết đang lưu hành có sẵn để giao dịch công khai trên thị trường chứng khoán bởi nhà đầu tư đại chúng, sau khi đã trừ đi số cổ phiếu bị hạn chế chuyển nhượng. Chỉ số này chỉ tính cổ phiếu phổ thông, nên cần phân biệt rõ từng <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/so-sanh-co-phieu-thuong-va-co-phieu-uu-dai\">loại cổ phần<\/a> khi đọc cơ cấu sở hữu.<\/p>", "links": [{"to": "so-sanh-co-phieu-thuong-va-co-phieu-uu-dai", "url": "https://www.dsc.com.vn/kien-thuc/so-sanh-co-phieu-thuong-va-co-phieu-uu-dai", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=3"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Phản ánh chất lượng cơ cấu cổ đông và độ minh bạch", "before": "<p>Một doanh nghiệp sở hữu tỷ lệ Free float ở mức cân bằng (từ 30% đến 60%) thể hiện cơ cấu cổ đông lành mạnh. Tỷ lệ này vừa đảm bảo ban lãnh đạo có sự cam kết quyền lợi dài hạn thông qua việc nắm giữ cổ phần lớn, vừa tạo khoảng trống thanh khoản hấp dẫn các nhà đầu tư bên ngoài tham gia giao dịch.<\/p>", "after": "<p>Một doanh nghiệp sở hữu tỷ lệ Free float ở mức cân bằng (từ 30% đến 60%) thể hiện cơ cấu cổ đông lành mạnh. Tỷ lệ này vừa đảm bảo ban lãnh đạo có sự cam kết quyền lợi dài hạn thông qua việc nắm giữ cổ phần lớn, vừa tạo khoảng trống thanh khoản hấp dẫn các nhà đầu tư bên ngoài tham gia giao dịch. Ngoài số liệu tài chính, <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a> cũng xem cơ cấu cổ đông để đánh giá rủi ro thanh khoản của cổ phiếu.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=35"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong", "title": "Hướng dẫn cách đọc báo cáo tài chính chi tiết cho người mới", "url": "https://www.dsc.com.vn/kien-thuc/huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Báo cáo tài chính là gì?", "before": "<p>Báo cáo tài chính là hệ thống văn bản phản ánh toàn bộ tình hình tài chính, tài sản, nợ vay và kết quả kinh doanh của doanh nghiệp trong một kỳ kế toán. Đối với các tập đoàn có công ty con, bạn cần đọc <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/bao-cao-tai-chinh-hop-nhat-la-gi\"><strong>báo cáo tài chính hợp nhất<\/strong><\/a> để phản ánh đầy đủ bức tranh thực tế của toàn bộ hệ thống.<\/p>", "after": "<p>Báo cáo tài chính là hệ thống văn bản phản ánh toàn bộ tình hình tài chính, tài sản, nợ vay và kết quả kinh doanh của doanh nghiệp trong một kỳ kế toán. Đối với các tập đoàn có công ty con, bạn cần đọc <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/bao-cao-tai-chinh-hop-nhat-la-gi\"><strong>báo cáo tài chính hợp nhất<\/strong><\/a> để phản ánh đầy đủ bức tranh thực tế của toàn bộ hệ thống. Đọc được báo cáo tài chính là kỹ năng nền của <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a> trước khi tính bất kỳ chỉ số nào.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=5"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Thuyết minh báo cáo tài chính (Notes)", "before": "<p>Thuyết minh báo cáo tài chính giải thích chi tiết các con số tổng hợp trong 3 báo cáo trên. Phần này trình bày các chính sách kế toán áp dụng, phương pháp khấu hao tài sản, chi tiết nợ vay và các giao dịch với bên liên quan.<\/p>", "after": "<p>Thuyết minh báo cáo tài chính giải thích chi tiết các con số tổng hợp trong 3 báo cáo trên. Phần này trình bày các chính sách kế toán áp dụng, phương pháp khấu hao tài sản, chi tiết nợ vay và các giao dịch với bên liên quan. Sau khi đọc xong các báo cáo, bước tiếp theo là <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-phan-tich-bao-cao-tai-chinh\">phân tích báo cáo tài chính<\/a> bằng chỉ số và so sánh nhiều kỳ.<\/p>", "links": [{"to": "cach-phan-tich-bao-cao-tai-chinh", "url": "https://www.dsc.com.vn/kien-thuc/cach-phan-tich-bao-cao-tai-chinh", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=23"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "loi-the-canh-tranh-la-gi", "title": "Lợi thế cạnh tranh là gì? 3 chiến lược và cách chọn cổ phiếu", "url": "https://www.dsc.com.vn/kien-thuc/loi-the-canh-tranh-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Lợi thế cạnh tranh là gì?", "before": "<p>Lợi thế cạnh tranh (Competitive Advantage) là tập hợp những năng lực, tài nguyên hoặc chiến lược đặc thù giúp một doanh nghiệp duy trì vị thế sinh lời và thị phần vượt trội so với các đối thủ trong cùng ngành.<\/p>", "after": "<p>Lợi thế cạnh tranh (Competitive Advantage) là tập hợp những năng lực, tài nguyên hoặc chiến lược đặc thù giúp một doanh nghiệp duy trì vị thế sinh lời và thị phần vượt trội so với các đối thủ trong cùng ngành. Đánh giá lợi thế này là phần định tính của <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, trước khi kiểm chứng bằng số liệu.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đ dich-khong-huong-quyen-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Cách tính giá cổ phiếu sau ngày giao dịch không hưởng quyền", "before": "<p><span style=\"font-weight:400;\">Phương pháp xác định giá mới của cổ phiếu sau ngày giao dịch không hưởng quyền được quy định như sau:<\/span> <strong>Bước 1: <\/strong><span style=\"font-weight:400;\">Tra cứu ngày giao dịch không hưởng quyền.&nbsp;<\/span> <strong>Bước 2:<\/strong><span style=\"font-weight:400;\"> Tính toán tỷ lệ cổ tức<\/span> <span style=\"font-weight:400;\">Công ty sẽ thông báo trước công chúng về tỷ lệ cổ tức. Tỷ lệ cổ tức sẽ được xác định dựa vào số lượng cổ phiếu cổ đông đang nắm giữ.<\/span> <strong>Bước 3:<\/strong><span style=\"font-weight:400;\"> Áp dụng tỷ lệ cổ tức hoặc phát hành thêm cổ phiếu để tính toán giá cổ phiếu mới<\/span> <span style=\"font-weight:400;\">Giá cổ phiếu mới = Giá cổ phiếu - số tiền tương đương với tỷ lệ cổ tức hoặc cổ phiếu&nbsp;<\/span> <span style=\"font-weight:400;\">Ví dụ: Nếu giá cổ phiếu trước ngày giao dịch không hưởng quyền là 100.000 đồng và công ty thông báo tỷ lệ cổ tức 10%. Bạn cần trừ đi 10% của giá cổ phiếu trước đó (100.000 x 10% = 10.000 đồng). Giá cổ phiếu lúc này được xác định là 100.000 – 10.000 = 90.000 đồng.<\/span><\/p>", "after": "<p><span style=\"font-weight:400;\">Phương pháp xác định giá mới của cổ phiếu sau ngày giao dịch không hưởng quyền được quy định như sau:<\/span> <strong>Bước 1: <\/strong><span style=\"font-weight:400;\">Tra cứu ngày giao dịch không hưởng quyền.&nbsp;<\/span> <strong>Bước 2:<\/strong><span style=\"font-weight:400;\"> Tính toán tỷ lệ cổ tức<\/span> <span style=\"font-weight:400;\">Công ty sẽ thông báo trước công chúng về tỷ lệ cổ tức. Tỷ lệ cổ tức sẽ được xác định dựa vào số lượng cổ phiếu cổ đông đang nắm giữ.<\/span> <strong>Bước 3:<\/strong><span style=\"font-weight:400;\"> Áp dụng tỷ lệ cổ tức hoặc phát hành thêm cổ phiếu để tính toán giá cổ phiếu mới<\/span> <span style=\"font-weight:400;\">Giá cổ phiếu mới = Giá cổ phiếu - số tiền tương đương với tỷ lệ cổ tức hoặc cổ phiếu&nbsp;<\/span> <span style=\"font-weight:400;\">Ví dụ: Nếu giá cổ phiếu trước ngày giao dịch không hưởng quyền là 100.000 đồng và công ty thông báo tỷ lệ cổ tức 10%. Bạn cần trừ đi 10% của giá cổ phiếu trước đó (100.000 x 10% = 10.000 đồng). Giá cổ phiếu lúc này được xác định là 100.000 – 10.000 = 90.000 đồng.<\/span><\/p>\n<p>Điều chỉnh giá sau ngày không hưởng quyền không làm thay đổi giá trị doanh nghiệp, nên <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a> cần tính định giá trên số cổ phiếu mới.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "newp", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=10"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "niem-yet-chung-khoan-ipo-la-gi-nhung-dieu-can-biet", "title": "Niêm yết chứng khoán (IPO) là gì? Điều kiện IPO chứng khoán", "url": "https://www.dsc.com.vn/kien-thuc/niem-yet-chung-khoan-ipo-la-gi-nhung-dieu-can-biet", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Khẳng định uy tín và gia tăng giá trị thương hiệu", "before": "<p>IPO được xem là minh chứng rõ nét cho năng lực và sự phát triển của một tổ chức. Việc có tên trên bảng niêm yết tại các sở giao dịch chứng khoán giúp doanh nghiệp khẳng định vị thế trong ngành và tạo dựng niềm tin vững chắc với các bên liên quan.<\/p>", "after": "<p>IPO được xem là minh chứng rõ nét cho năng lực và sự phát triển của một tổ chức. Việc có tên trên bảng niêm yết tại các sở giao dịch chứng khoán giúp doanh nghiệp khẳng định vị thế trong ngành và tạo dựng niềm tin vững chắc với các bên liên quan. Với nhà đầu tư, cổ phiếu mới niêm yết vẫn cần <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a> như mọi mã khác thay vì dựa vào sức hút thương hiệu.<\/p>", "links": [{"to hạn", "before": "<p>Nợ dài hạn là các khoản nợ có thời hạn thanh toán trên 12 tháng. Các hình thức nợ dài hạn phổ biến gồm: vay dài hạn ngân hàng, trái phiếu phát hành, thuê tài chính dài hạn (finance lease) và các khoản dự phòng bảo hành dài hạn.Nợ dài hạn tăng không nhất thiết là tiêu cực — doanh nghiệp đang mở rộng nhà máy hoặc phát hành trái phiếu để đầu tư dự án mới sẽ ghi nhận nợ dài hạn tăng trước khi dự án sinh doanh thu.<\/p>", "after": "<p>Nợ dài hạn là các khoản nợ có thời hạn thanh toán trên 12 tháng. Các hình thức nợ dài hạn phổ biến gồm: vay dài hạn ngân hàng, trái phiếu phát hành, thuê tài chính dài hạn (finance lease) và các khoản dự phòng bảo hành dài hạn.Nợ dài hạn tăng không nhất thiết là tiêu cực — doanh nghiệp đang mở rộng nhà máy hoặc phát hành trái phiếu để đầu tư dự án mới sẽ ghi nhận nợ dài hạn tăng trước khi dự án sinh doanh thu. Khi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong\">đọc báo cáo tài chính<\/a>, nợ dài hạn cần đối chiếu với tài sản dài hạn mà khoản vay đó tài trợ.<\/p>", "links": [{"to": "huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong", "url": "https://www.dsc.com.vn/kien-thuc/huong-dan-cach-doc-bao-cao-tai-chinh-nhung-thong-tin-quan-trong", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=16"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Cách tính nợ phải trả của doanh nghiệp", "before": "<p>Số liệu này được lấy trực tiếp từ Bảng cân đối kế toán, mã số B (Nợ phải trả), trong phần Nguồn vốn.<\/p>", "after": "<p>Số liệu này được lấy trực tiếp từ Bảng cân đối kế toán, mã số B (Nợ phải trả), trong phần Nguồn vốn. Khi <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-phan-tich-bao-cao-tai-chinh\">phân tích báo cáo tài chính<\/a>, cần so nợ phải trả qua nhiều kỳ để thấy doanh nghiệp đang tăng hay giảm vay.<\/p>", "links": [{"to": "cach-phan-tich-bao-cao-tai-chinh", "url": "https://www.dsc.com.vn/kien-thuc/cach-phan-tich-bao-cao-tai-chinh", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=29"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "peg-la-gi", "title": "PEG là gì? Cách tính và ứng dụng chỉ số PEG đầu tư hiệu quả", "url": "https://www.dsc.com.vn/kien-thuc/peg-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Điều chỉnh chỉ số PEG với cổ tức cho doanh nghiệp blue-chip ổn định", "before": "<p>Chỉ số này đặc biệt hữu ích khi phân tích các cổ phiếu blue-chip hoặc các doanh nghiệp trong ngành tiện ích, năng lượng - những nơi có tốc độ tăng trưởng lợi nhuận không cao nhưng dòng tiền cổ tức lại rất ổn định.<\/p>", "after": "<p>Chỉ số này đặc biệt hữu ích khi phân tích các cổ phiếu blue-chip hoặc các doanh nghiệp trong ngành tiện ích, năng lượng - những nơi có tốc độ tăng trưởng lợi nhuận không cao nhưng dòng tiền cổ tức lại rất ổn định. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a>, PEG và PEGY bổ sung cho P/E khi so các doanh nghiệp có tốc độ tăng trưởng khác nhau.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=66"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "phan-tich-bao-cao-tai-chinh-cong-ty-bibica", "title": "Phân tích báo cáo tài chính Công ty Cổ phần Bibica", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-bao-cao-tai-chinh-cong-ty-bibica", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Tổng quan kết quả kinh doanh công ty Bibica", "before": "<p>Trong 9 tháng đầu năm 2025, Bibica ghi nhận doanh thu thuần đạt 1.126,82 tỷ đồng, tăng nhẹ 2,54% so với cùng kỳ năm 2024. Mặc dù tốc độ tăng trưởng doanh thu chậm lại, lợi nhuận sau thuế của công ty lại tăng mạnh 17,36%, đạt 70,93 tỷ đồng. Điều này cho thấy Bibica đã cải thiện đáng kể hiệu quả vận hành và tối ưu hóa chi phí để nâng cao khả năng sinh lời.<\/p>", "after": "<p>Trong 9 tháng đầu năm 2025, Bibica ghi nhận doanh thu thuần đạt 1.126,82 tỷ đồng, tăng nhẹ 2,54% so với cùng kỳ năm 2024. Mặc dù tốc độ tăng trưởng doanh thu chậm lại, lợi nhuận sau thuế của công ty lại tăng mạnh 17,36%, đạt 70,93 tỷ đồng. Điều này cho thấy Bibica đã cải thiện đáng kể hiệu quả vận hành và tối ưu hóa chi phí để nâng cao khả năng sinh lời. Lợi nhuận tăng nhanh hơn doanh thu là tín hiệu mà <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a> cần kiểm tra nguồn gốc, từ biên gộp hay thu nhập bất thường.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=3"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "phan-tich-dupont-la-gi", "title": "Phân tích Dupont là gì? Ưu nhược điểm và ý nghĩa Dupont", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-dupont-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Công cụ so sánh và ra quyết định đầu tư", "before": "<p>Một trong những lợi ích quan trọng nhất của phương pháp phân tích Dupont là khả năng biến nó thành một công cụ mạnh mẽ để so sánh hiệu suất giữa các công ty và hỗ trợ quá trình ra quyết định đầu tư. Bằng cách phân rã ROE thành ba thành phần chính – biên lợi nhuận ròng, vòng quay tổng tài sản và đòn bẩy tài chính – nhà đầu tư có thể nhìn sâu hơn vào các yếu tố thúc đẩy lợi nhuận của một doanh nghiệp.<\/p>", "after": "<p>Một trong những lợi ích quan trọng nhất của phương pháp phân tích Dupont là khả năng biến nó thành một công cụ mạnh mẽ để so sánh hiệu suất giữa các công ty và hỗ trợ quá trình ra quyết định đầu tư. Bằng cách phân rã ROE thành ba thành phần chính – biên lợi nhuận ròng, vòng quay tổng tài sản và đòn bẩy tài chính – nhà đầu tư có thể nhìn sâu hơn vào các yếu tố thúc đẩy lợi nhuận của một doanh nghiệp. Đây là lý do DuPont là công cụ quen thuộc trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản<\/a> khi so sánh các doanh nghiệp cùng ngành.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=36"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "quy-tac-72-la-gi", "title": "Quy tắc 72 là gì? Công thức tính và ứng dụng trong đầu tư", "url": "https://www.dsc.com.vn/kien-thuc/quy-tac-72-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Quy tắc 72 là gì?", "before": "<p>Quy tắc 72 Rule of 72) là một công thức tài chính đơn giản giúp bạn ước tính nhanh thời gian cần thiết để một khoản đầu tư tăng gấp đôi giá trị, dựa trên sức mạnh của lãi suất kép. Phép tính dựa trên mức lãi suất cố định hàng năm. Nó giả định toàn bộ phần lợi nhuận được tái đầu tư liên tục.&nbsp;<\/p>", "after": "<p>Quy tắc 72 Rule of 72) là một công thức tài chính đơn giản giúp bạn ước tính nhanh thời gian cần thiết để một khoản đầu tư tăng gấp đôi giá trị, dựa trên sức mạnh của lãi suất kép. Phép tính dựa trên mức lãi suất cố định hàng năm. Nó giả định toàn bộ phần lợi nhuận được tái đầu tư liên tục.&nbsp; Cùng logic lãi kép, các mô hình <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cach-dinh-gia-co-phieu-cho-nguoi-moi-bat-dau\">định giá cổ phiếu<\/a> chiết khấu dòng tiền tương lai về hiện tại.<\/p>", "links": [{"to": "cach-dinh-gia-co-phieu-cho-nguoi-moi-bat-dau", "url": "https://www.dsc.com.vn/kien-thuc/cach-dinh-gia-co-phieu-cho-nguoi-moi-bat-dau", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=3"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Quy tắc 72 là gì?", "before": "<p><i>Lưu ý: Quy tắc 72 là một ước lượng ngón tay cái mang tính tương đối. Nó giúp bạn tính toán nhanh mà không cần dùng đến Excel hay các máy tính tài chính phức tạp.<\/i><\/p>", "after": "<p><i>Lưu ý: Quy tắc 72 là một ước lượng ngón tay cái mang tính tương đối. Nó giúp bạn tính toán nhanh mà không cần dùng đến Excel hay các máy tính tài chính phức tạp.<\/i> Quy tắc này hữu ích khi so kênh đầu tư, còn chọn cổ phiếu cụ thể vẫn cần <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi\">phân tích cơ bản doanh nghiệp<\/a>.<\/p>", "links": [{"to": "phan-tich-co-ban-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-co-ban-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=6"}], "group": ["cluster"], "pri": "P2"}, {"pos": "Công thức Quy tắc 72", "before": "<p>Để tìm số năm nhân đôi (<strong>n<\/strong>), ta giải phương trình bằng cách lấy logarit tự nhiên hai vế: <strong>n = ln(2) / ln(1 + r)<\/strong>. Với các mức lãi suất thông thường, <strong>ln(1 + r)<\/strong> xấp xỉ bằng <strong>r<\/strong>, còn <strong>ln(2)<\/strong> cố định ở mức <strong>0,693<\/strong>. Từ đó, công thức được rút gọn thành: <strong>n = 0,693 / r<\/strong>.<\/p>", "after": "<p>Để tìm số năm nhân đôi (<strong>n<\/strong>), ta giải phương trình bằng cách lấy logarit tự nhiên hai vế: <strong>n = ln(2) / ln(1 + r)<\/strong>. Với các mức lãi suất thông thường, <strong>ln(1 + r)<\/strong> xấp xỉ bằng <strong>r<\/strong>, còn <strong>ln(2)<\/strong> cố định ở mức <strong>0,693<\/strong>. Từ đó, công thức được rút gọn thành: <strong>n = 0,693 / r<\/strong>. Phép chiết khấu ngược của lãi kép chính là nền tảng của <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/dcf-la-gi\">phương pháp DCF<\/a> khi đưa dòng tiền tương lai về hiện tại.<\/p>", "links": [{"to": "dcf-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/dcf-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=18"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "roce-la-gi", "title": "ROCE là gì? Cách tính và ứng dụng ROCE  document.querySelectorAll("input[data-id]").forEach(x=>{x.checked=!!st[x.dataset.id];x.onchange=()=>{st[x.dataset.id]=x.checked;sync(x.closest("article"));save();apply()}});
 document.querySelectorAll("input[data-art]").forEach(x=>{x.onchange=()=>{x.closest("article").querySelectorAll("input[data-id]").forEach(y=>{y.checked=x.checked;st[y.dataset.id]=x.checked});save();apply()}});
 document.querySelectorAll("article").forEach(sync);apply()}
function sync(art){const ys=[...art.querySelectorAll("input[data-id]")];art.querySelector("input[data-art]").checked=ys.every(y=>y.checked)}
function apply(){const g=fG.value,p=document.getElementById("fP").value,q=document.getElementById("fQ").value.toLowerCase(),hide=document.getElementById("fD").value==="hide";
 let tot=0,dn=0;
 document.querySelectorAll("article").forEach(art=>{const a=DATA.arts.find(x=>x.slug===art.dataset.slug);let vis=0;
  art.querySelectorAll(".chg").forEach(c=>{const d=!!st[c.dataset.id];tot++;dn+=d;c.classList.toggle("done",d);
   const show=(g==="all"||c.dataset.g.split(" ").includes(g))&&(p==="all"||c.dataset.p===p)&&!(hide&&d);c.hidden=!show;vis+=show});
  const allDone=[...art.querySelectorAll(".chg")].every(c=>st[c.dataset.id]);art.classList.toggle("done",allDone);
  art.hidden=!vis||(q&&!(a.slug+" "+a.title).toLowerCase().includes(q))});
 document.getElementById("sum").textContent=`${dn}/${tot} block đã sửa · ${DATA.arts.length} bài`;document.getElementById("bar").style.width=(tot?100*dn/tot:0)+"%"}
["fG","fP","fQ","fD"].forEach(i=>document.getElementById(i).addEventListener("input",apply));
document.getElementById("exp").onclick=()=>{const s=DATA.arts.filter(a=>a.items.some((_,k)=>st[a.slug+"#"+k])).map(a=>a.slug);
 navigator.clipboard.writeText("python scripts/sync_live.py --only "+s.join(","));document.getElementById("exp").textContent="Đã copy lệnh sync ("+s.length+" bài)"};
render();
</script>
