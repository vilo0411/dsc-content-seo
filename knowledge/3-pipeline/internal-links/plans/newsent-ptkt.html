p dir=\"ltr\">Sau đó, một tỷ lệ giữa dòng tiền dương và âm được đưa vào công thức RSI để tạo ra một bộ dao động di chuyển trong khoảng từ 0 đến 100. Là một chỉ báo dao động xung lượng gắn liền với khối lượng, MFI phù hợp nhất để xác định các tín hiệu đảo chiều và cực trị của giá với nhiều tín hiệu khác nhau. Nhờ gắn với khối lượng, MFI cũng là một công cụ đo <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phuong-phap-dau-tu-theo-dong-tien-hieu-qua\">dòng tiền chứng khoán<\/a> vào hay ra khỏi một mã.<\/p>", "links": [{"to": "phuong-phap-dau-tu-theo-dong-tien-hieu-qua", "url": "https://www.dsc.com.vn/kien-thuc/phuong-phap-dau-tu-theo-dong-tien-hieu-qua", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "hub · đoạn i=3"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "sideway-la-gi", "title": "Sideway là gì? 4 cách nhận biết và chiến lược giao dịch", "url": "https://www.dsc.com.vn/kien-thuc/sideway-la-gi", "clicks": 0, "pri": "P1", "group": ["cluster"], "items": [{"pos": "Sideway là gì?", "before": "<p>Trạng thái này thể hiện sự cân bằng tạm thời giữa lực cung và lực cầu. Phe mua và phe bán đều đang do dự chờ đợi các tín hiệu vĩ mô mới.<\/p>", "after": "<p>Trạng thái này thể hiện sự cân bằng tạm thời giữa lực cung và lực cầu. Phe mua và phe bán đều đang do dự chờ đợi các tín hiệu vĩ mô mới. Trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-ky-thuat-la-gi\">phân tích kỹ thuật<\/a>, vùng đi ngang được giới hạn bởi một đường hỗ trợ phía dưới và một đường kháng cự phía trên.<\/p>", "links": [{"to": "phan-tich-ky-thuat-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-ky-thuat-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "pillar · đoạn i=5"}], "group": ["cluster"], "pri": "P1"}, {"pos": "So sánh chiến lược Sideway và Breakout/Breakdown", "before": "<p dir=\"ltr\">Nhìn chung cả 2 chiến lược đều có những ưu, nhược điểm riêng tùy vào từng giai đoạn thị trường mà chúng ta có thể áp dụng. Ngoài ra, việc chọn chiến lược giao dịch còn phù hợp với khẩu vị của từng nhà đầu tư.<\/p>", "after": "<p dir=\"ltr\">Nhìn chung cả 2 chiến lược đều có những ưu, nhược điểm riêng tùy vào từng giai đoạn thị trường mà chúng ta có thể áp dụng. Ngoài ra, việc chọn chiến lược giao dịch còn phù hợp với khẩu vị của từng nhà đầu tư. Người quen <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/giao-dich-theo-xu-huong-trend-following-la-gi\">giao dịch theo xu hướng<\/a> nên đứng ngoài khi thị trường đi ngang và chỉ quay lại sau phiên phá vỡ có khối lượng lớn.<\/p>", "links": [{"to": "giao-dich-theo-xu-huong-trend-following-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/giao-dich-theo-xu-huong-trend-following-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P1", "why": "sub-hub · đoạn i=34"}], "group": ["cluster"], "pri": "P1"}]}, {"slug": "chi-bao-chaikin-oscillator-la-gi", "title": "Chỉ báo Chaikin Oscillator là gì? Ứng dụng trong giao dịch", "url": "https://www.dsc.com.vn/kien-thuc/chi-bao-chaikin-oscillator-la-gi", "clicks": 7, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Chỉ báo Chaikin Oscillator là gì?", "before": "<p>Thực chất, Chaikin Oscillator là một \"chỉ báo của chỉ báo\". Thay vì phản ánh trực tiếp biến động của giá, nó đo lường tốc độ thay đổi của dòng tiền tích lũy/phân phối.<\/p>", "after": "<p>Thực chất, Chaikin Oscillator là một \"chỉ báo của chỉ báo\". Thay vì phản ánh trực tiếp biến động của giá, nó đo lường tốc độ thay đổi của dòng tiền tích lũy/phân phối. Với người <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phuong-phap-dau-tu-theo-dong-tien-hieu-qua\">đầu tư theo dòng tiền<\/a>, chỉ báo này cho biết tiền đang vào nhanh dần hay chậm dần, trước khi giá phản ứng.<\/p>", "links": [{"to": "phuong-phap-dau-tu-theo-dong-tien-hieu-qua", "url": "https://www.dsc.com.vn/kien-thuc/phuong-phap-dau-tu-theo-dong-tien-hieu-qua", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=4"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "downtrend-la-gi-cach-nhan-biet-va-giao-dich-trong-downtrend", "title": "Downtrend là gì? Cách nhận biết và giao dịch trong downtrend", "url": "https://www.dsc.com.vn/kien-thuc/downtrend-la-gi-cach-nhan-biet-va-giao-dich-trong-downtrend", "clicks": 6, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Downtrend là gì?", "before": "<p>Dưới góc nhìn kỹ thuật, một xu hướng giảm được xác lập khi biểu đồ giá hình thành cấu trúc đỉnh sau thấp hơn đỉnh trước và đáy sau thấp hơn đáy trước. Khi Downtrend xảy ra, tâm lý bi quan bao trùm thị trường, áp lực bán hoàn toàn áp đảo lực mua.<\/p>", "after": "<p>Dưới góc nhìn kỹ thuật, một xu hướng giảm được xác lập khi biểu đồ giá hình thành cấu trúc đỉnh sau thấp hơn đỉnh trước và đáy sau thấp hơn đáy trước. Khi Downtrend xảy ra, tâm lý bi quan bao trùm thị trường, áp lực bán hoàn toàn áp đảo lực mua. Cách xác định theo đỉnh đáy này đến từ lý thuyết Dow, nền móng của <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-ky-thuat-la-gi\">phân tích kỹ thuật<\/a> hiện đại.<\/p>", "links": [{"to": "phan-tich-ky-thuat-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-ky-thuat-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=3"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-bao-adx-la-gi", "title": "ADX là gì? Cách sử dụng chỉ báo ADX trong giao dịch", "url": "https://www.dsc.com.vn/kien-thuc/chi-bao-adx-la-gi", "clicks": 5, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Chỉ báo ADX là gì?", "before": "<p>ADX (Average Directional Index) là chỉ báo đo lường cường độ của xu hướng, được phát triển bởi J. Welles Wilder vào năm 1978. Chỉ số này không dùng để xác định hướng giá tăng hay giảm mà chỉ tập trung vào sức mạnh của dòng tiền hiện tại.<\/p>", "after": "<p>ADX (Average Directional Index) là chỉ báo đo lường cường độ của xu hướng, được phát triển bởi J. Welles Wilder vào năm 1978. Chỉ số này không dùng để xác định hướng giá tăng hay giảm mà chỉ tập trung vào sức mạnh của dòng tiền hiện tại. Vì vậy, trong nhóm <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat\">chỉ báo xác định xu hướng<\/a>, ADX đóng vai trò bộ lọc: cho biết có nên dùng chiến lược theo xu hướng hay không.<\/p>", "links": [{"to": "cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat", "url": "https://www.dsc.com.vn/kien-thuc/cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=4"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-bao-momentum-la-gi", "title": "Chỉ báo Momentum là gì? Ứng dụng chỉ báo động lượng", "url": "https://www.dsc.com.vn/kien-thuc/chi-bao-momentum-la-gi", "clicks": 5, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Thiết lập chu kỳ chỉ báo Momentum tối ưu cho thị trường Việt Nam", "before": "<p>Khuyến nghị: Bắt đầu với chu kỳ 10 phiên nếu bạn đang giao dịch swing. Kiểm thử back-test trên ít nhất 50 giao dịch trước khi chốt tham số. Chu kỳ tối ưu phụ thuộc vào từng cổ phiếu, không có con số nào đúng cho tất cả.<\/p>", "after": "<p>Khuyến nghị: Bắt đầu với chu kỳ 10 phiên nếu bạn đang giao dịch swing. Kiểm thử back-test trên ít nhất 50 giao dịch trước khi chốt tham số. Chu kỳ tối ưu phụ thuộc vào từng cổ phiếu, không có con số nào đúng cho tất cả. Nguyên tắc này đúng với mọi công cụ <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-ky-thuat-la-gi\">phân tích kỹ thuật<\/a>: tham số phải được kiểm chứng trên chính mã đang giao dịch.<\/p>", "links": [{"to": "phan-tich-ky-thuat-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-ky-thuat-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=43"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "duong-phan-phoi-tich-luy-a-d-la-gi", "title": "Đươ ể được diễn giải tương tự như các đường trung bình động truyền thống nhưng sở hữu tốc độ phản hồi nhanh hơn. Chỉ báo này thường được dùng để xác nhận xu hướng hoặc phát hiện sớm các tín hiệu đảo chiều. So với các <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat\">chỉ báo xu hướng<\/a> cùng nhóm như SMA hay EMA, HMA đổi hướng sớm hơn nên cũng dễ cho tín hiệu giả hơn.<\/p>", "links": [{"to": "cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat", "url": "https://www.dsc.com.vn/kien-thuc/cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=36"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "huong-dan-ket-hop-3-duong-ma-trong-giao-dich-va-dau-tu-hieu-qua", "title": "Hướng dẫn kết hợp 3 đường MA trong giao dịch và đầu tư hiệu quả", "url": "https://www.dsc.com.vn/kien-thuc/huong-dan-ket-hop-3-duong-ma-trong-giao-dich-va-dau-tu-hieu-qua", "clicks": 5, "pri": "P2", "group": ["cluster"], "items": [{"pos": "3 Đường MA được sử dụng trong phân tích kỹ thuật", "before": "<p dir=\"ltr\">Đường trung bình tuyến tính có trọng số (<a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/duong-wma-la-gi\"><strong>WMA<\/strong><\/a>) là đường trung bình động còn nhanh hơn cả EMA do cách lấy trọng số rất cao cho những phiên gần nhất.<\/p>", "after": "<p dir=\"ltr\">Đường trung bình tuyến tính có trọng số (<a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/duong-wma-la-gi\"><strong>WMA<\/strong><\/a>) là đường trung bình động còn nhanh hơn cả EMA do cách lấy trọng số rất cao cho những phiên gần nhất. Cả ba loại đều thuộc nhóm <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat\">chỉ báo xác định xu hướng<\/a>, khác nhau ở độ nhạy với các phiên gần nhất.<\/p>", "links": [{"to": "cac-chi-bao-xac-dinh-xu-h : "P2", "group": ["cluster"], "items": [{"pos": "Bullish là gì trong chứng khoán?", "before": "<p>Trong thị trường chứng khoán, thuật ngữ \"bullish\" được sử dụng để mô tả xu hướng tăng giá của thị trường. Khi thị trường bullish, các nhà đầu tư thường có tâm lý lạc quan và kỳ vọng giá cổ phiếu sẽ tiếp tục tăng trong tương lai.<\/p>", "after": "<p>Trong thị trường chứng khoán, thuật ngữ \"bullish\" được sử dụng để mô tả xu hướng tăng giá của thị trường. Khi thị trường bullish, các nhà đầu tư thường có tâm lý lạc quan và kỳ vọng giá cổ phiếu sẽ tiếp tục tăng trong tương lai. Thị trường bullish là môi trường thuận lợi cho <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/giao-dich-theo-xu-huong-trend-following-la-gi\">giao dịch theo xu hướng<\/a>, khi mỗi nhịp điều chỉnh đều tạo đáy cao hơn đáy trước.<\/p>", "links": [{"to": "giao-dich-theo-xu-huong-trend-following-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/giao-dich-theo-xu-huong-trend-following-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "sub-hub · đoạn i=1"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-bao-dao-dong-aroon-aroon-oscillator-la-gi", "title": "Chỉ báo dao động Aroon (Aroon Oscillator) là gì? Hướng dẫn sử dụng chỉ báo dao động Aroon kết hợp xu hướng thị trường", "url": "https://www.dsc.com.vn/kien-thuc/chi-bao-dao-dong-aroon-aroon-oscillator-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Ý nghĩa của chỉ báo dao động Aroon", "before": "<p dir=\"ltr\">Trên thực tế, chỉ báo Aroon có thể ở mức dương hoặc âm trong một khoảng thời gian khá dài nên việc phân tích khá dễ dàng. Thời điểm và giá có xu hướng tăng khi chỉ báo dương và xu hướng giảm khi chỉ báo âm. Chúng ta cũng có thể sử dụng mức +50 và -50 có thể cho chúng ta những tín hiệu mạnh mẽ hơn, ví dụ như nếu chỉ báo vượt qua +50 tức là một xu hướng tăng mạnh còn nếu xuống dưới -50 là một xu hướng giảm mạnh.<\/p>", "after": "<p dir=\"ltr\">Trên thực tế, chỉ báo Aroon có thể ở mức dương hoặc âm trong một khoảng thời gian khá dài nên việc phân tích khá dễ dàng. Thời điểm và giá có xu hướng tăng khi chỉ báo dương và xu hướng giảm khi chỉ báo âm. Chúng ta cũng có thể sử dụng mức +50 và -50 có thể cho chúng ta những tín hiệu mạnh mẽ hơn, ví dụ như nếu chỉ báo vượt qua +50 tức là một xu hướng tăng mạnh còn nếu xuống dưới -50 là một xu hướng giảm mạnh. Cách đọc theo ngưỡng này khiến Aroon Oscillator trở thành một <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat\">chỉ báo xu hướng<\/a> dễ dùng cho người mới.<\/p>", "links": [{"to": "cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat", "url": "https://www.dsc.com.vn/kien-thuc/cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=9"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-bao-force-index-la-gi", "title": "Chỉ báo Force Index là gì? 7 chiến lược giao dịch hiệu quả", "url": "https://www.dsc.com.vn/kien-thuc/chi-bao-force-index-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Công thức tính chỉ báo Force Index", "before": "<p>Việc áp dụng đường trung bình động này giúp loại bỏ bớt các biến động ngắn hạn, mang lại cái nhìn tổng quan và đáng tin cậy hơn về xu hướng trung hạn.<\/p>", "after": "<p>Việc áp dụng đường trung bình động này giúp loại bỏ bớt các biến động ngắn hạn, mang lại cái nhìn tổng quan và đáng tin cậy hơn về xu hướng trung hạn. Làm mượt bằng trung bình động là kỹ thuật chung của nhiều <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chi-bao-ky-thuat\">chỉ báo kỹ thuật<\/a>, từ MACD đến Stochastic.<\/p>", "links": [{"to": "chi-bao-ky-thuat", "url": "https://www.dsc.com.vn/kien-thuc/chi-bao-ky-thuat", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=31"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "chi-bao-klinger-oscillator-la-gi", "title": "Chỉ báo Klinger Oscillator là gì? Ứng dụng đầu tư hiệu quả", "url": "https://www.dsc.com.vn/kien-thuc/chi-bao-klinger-oscillator-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Chỉ báo Klinger Oscillator là gì?", "before": "<p>Không giống các chỉ báo động lượng thông thường chỉ dựa vào giá đóng cửa, Klinger Oscillator tích hợp thêm yếu tố khối lượng. Sự kết hợp này giúp đo lường \"Lực khối lượng\" (Volume Force - VF) và xác nhận sức mạnh thực tế của một xu hướng. Nhờ đó, Klinger Oscillator trở thành công cụ hỗ trợ đắc lực giúp nhà đầu tư chứng khoán đánh giá động lượng dòng tiền và tối ưu hóa thời điểm vào/ra lệnh.<\/p>", "after": "<p>Không giống các chỉ báo động lượng thông thường chỉ dựa vào giá đóng cửa, Klinger Oscillator tích hợp thêm yếu tố khối lượng. Sự kết hợp này giúp đo lường \"Lực khối lượng\" (Volume Force - VF) và xác nhận sức mạnh thực tế của một xu hướng. Nhờ đó, Klinger Oscillator trở thành công cụ hỗ trợ đắc lực giúp nhà đầu tư chứng khoán đánh giá động lượng dòng tiền và tối ưu hóa thời điểm vào/ra lệnh. Trong hệ thống <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/chi-bao-ky-thuat\">chỉ báo kỹ thuật<\/a>, Klinger thuộc nhóm khối lượng, cùng với OBV và Chaikin Money Flow.<\/p>", "links": [{"to": "chi-bao-ky-thuat", "url": "https://www.dsc.com.vn/kien-thuc/chi-bao-ky-thuat", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "hub · đoạn i=5"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "dai-trung-binh-dong-moving-average-ribbon-la-gi", "title": "Dải trung bình động (Moving Average Ribbon) là gì?", "url": "https://www.dsc.com.vn/kien-thuc/dai-trung-binh-dong-moving-average-ribbon-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Dải trung bình động (Moving Average Ribbon) là gì?", "before": "<p>Khi các đường trung bình động xếp chồng và mở rộng, chúng tạo thành một dải màu giúp nhà giao dịch nhận diện xu hướng, sức mạnh xu hướng và điểm vào/ra lệnh một cách trực quan hơn. Nếu giá đóng cửa vượt lên trên dải trung bình động và dải có xu hướng mở rộng, đó thường là tín hiệu cho thấy xu hướng tăng đang hình thành hoặc được củng cố. Ngược lại, khi giá cắt xuống dưới dải trung bình động và dải bắt đầu thu hẹp, điều này có thể báo hiệu xu hướng giảm đang chiếm ưu thế.<\/p>", "after": "<p>Khi các đường trung bình động xếp chồng và mở rộng, chúng tạo thành một dải màu giúp nhà giao dịch <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat\">nhận diện xu hướng<\/a>, sức mạnh xu hướng và điểm vào/ra lệnh một cách trực quan hơn. Nếu giá đóng cửa vượt lên trên dải trung bình động và dải có xu hướng mở rộng, đó thường là tín hiệu cho thấy xu hướng tăng đang hình thành hoặc được củng cố. Ngược lại, khi giá cắt xuống dưới dải trung bình động và dải bắt đầu thu hẹp, điều này có thể báo hiệu xu hướng giảm đang chiếm ưu thế.<\/p>", "links": [{"to": "cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat", "url": "https://www.dsc.com.vn/kien-thuc/cac-chi-bao-xac-dinh-xu-huong-dang-tin-cay-trong-phan-tich-ky-thuat", "anchor": "nhận diện xu hướng", "op": "wrap", "group": "cluster", "pri": "P2", "why": "hub · bọc cụm có sẵn"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "do-thi-ky-thuat-la-gi", "title": "Đồ thị kỹ thuật là gì? Hướng dẫn cách đọc biểu đồ nến chứng khoán", "url": "https://www.dsc.com.vn/kien-thuc/do-thi-ky-thuat-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Đồ thị kỹ thuật là gì?", "before": "<p dir=\"ltr\">Đồ thị kỹ thuật là công cụ tài chính giúp <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-chung-khoan-la-gi\"><strong>phân tích chứng khoán<\/strong><\/a> và dự báo sự biến động giá trong tương lai.<\/p>", "after": "<p dir=\"ltr\">Đồ thị kỹ thuật là công cụ tài chính giúp <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-chung-khoan-la-gi\"><strong>phân tích chứng khoán<\/strong><\/a> và dự báo sự biến động giá trong tương lai. Mọi phương pháp <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-ky-thuat-la-gi\">phân tích kỹ thuật<\/a> đều bắt đầu từ đồ thị, vì đây là nơi giá và khối lượng được trình bày theo thời gian.<\/p>", "links": [{"to": "phan-tich-ky-thuat-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-ky-thuat-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=2"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "duong-trung-binh-dong-luy-thua-dema-la-gi", "title": "Đường trung bình động DEMA là gì? Cách ứng dụng thực chiến", "url": "https://www.dsc.com.vn/kien-thuc/duong-trung-binh-dong-luy-thua-dema-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Ứng dụng đường DEMA để xác nhận xu hướng giá", "before": "<p>Về cơ bản, DEMA có các cách ứng dụng tương tự như <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/duong-ema-la-gi\"><strong>đường EMA<\/strong><\/a>, nhưng nhờ ưu điểm phản hồi nhanh, chỉ báo này thường hỗ trợ nhà đầu tư phát hiện sớm các tín hiệu đảo chiều hoặc sự thay đổi trong cấu trúc xu hướng.<\/p>", "after": "<p>Về cơ bản, DEMA có các cách ứng dụng tương tự như <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/duong-ema-la-gi\"><strong>đường EMA<\/strong><\/a>, nhưng nhờ ưu điểm phản hồi nhanh, chỉ báo này thường hỗ trợ nhà đầu tư phát hiện sớm các tín hiệu đảo chiều hoặc sự thay đổi trong cấu trúc xu hướng. Như các đường trung bình khác trong <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-ky-thuat-la-gi\">phân tích kỹ thuật<\/a>, DEMA phát huy tốt khi thị trường có xu hướng và kém khi giá đi ngang.<\/p>", "links": [{"to": "phan-tich-ky-thuat-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-ky-thuat-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=26"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "mo-hinh-cai-nem-la-gi", "title": "Mô hình cái nêm là gì? Ứng dụng mô hình nêm trong đầu tư", "url": "https://www.dsc.com.vn/kien-thuc/mo-hinh-cai-nem-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Mô hình cái nêm là gì?", "before": "<p><strong>Mô hình cái nêm (Wedge Pattern)<\/strong> là một mẫu hình biểu đồ giá hội tụ, thường xuất hiện sau một xu hướng tăng hoặc giảm rõ rệt. Về mặt hình quan, mô hình này được cấu tạo bởi hai <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/duong-trendline-la-gi-cach-su-dung-hieu-qua-trong-phan-tich-ky-thuat\"><strong>đường xu hướng<\/strong><\/a> (kháng cự và hỗ trợ) cùng dốc về một hướng (cùng lên hoặc cùng xuống) và hội tụ tại một điểm.<\/p>", "after": "<p><strong>Mô hình cái nêm (Wedge Pattern)<\/strong> là một mẫu hình biểu đồ giá hội tụ, thường xuất hiện sau một xu hướng tăng hoặc giảm rõ rệt. Về mặt hình quan, mô hình này được cấu tạo bởi hai <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/duong-trendline-la-gi-cach-su-dung-hieu-qua-trong-phan-tich-ky-thuat\"><strong>đường xu hướng<\/strong><\/a> (kháng cự và hỗ trợ) cùng dốc về một hướng (cùng lên hoặc cùng xuống) và hội tụ tại một điểm. Đây là một trong các mô hình giá cơ bản của <a target=\"_blank\" href=\"https://www.dsc.com.vn/kien-thuc/phan-tich-ky-thuat-la-gi\">phân tích kỹ thuật<\/a>, cùng nhóm với tam giác và cờ đuôi nheo.<\/p>", "links": [{"to": "phan-tich-ky-thuat-la-gi", "url": "https://www.dsc.com.vn/kien-thuc/phan-tich-ky-thuat-la-gi", "anchor": "", "op": "append", "group": "cluster", "pri": "P2", "why": "pillar · đoạn i=2"}], "group": ["cluster"], "pri": "P2"}]}, {"slug": "phan-phoi-dinh-la-gi", "title": "Phân phối đỉnh là gì? Cách nhận biết phân phối đỉnh hiệu quả", "url": "https://www.dsc.com.vn/kien-thuc/phan-phoi-dinh-la-gi", "clicks": 0, "pri": "P2", "group": ["cluster"], "items": [{"pos": "Phân phối đỉnh là gì?", "before": "<p><span>Ở vùng đỉnh, bảng đi const st=JSON.parse(localStorage.getItem(KEY)||"{}");const save=()=>localStorage.setItem(KEY,JSON.stringify(st));
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GN={fix:"Sửa link sai",cluster:"Link pillar/hub",backfill:"Link tới bài traffic cao",...DATA.groups};
const fG=document.getElementById("fG");for(const g of [...new Set(DATA.arts.flatMap(a=>a.group))])fG.add(new Option(GN[g]||g,g));
function preview(after,item){const d=document.createElement("div");d.innerHTML=after;
  const urls=new Set(item.links.filter(l=>l.op!=="unlink").map(l=>l.url));
  d.querySelectorAll("a").forEach(a=>{if(urls.has(a.getAttribute("href")))a.className="new";a.removeAttribute("target");a.onclick=e=>e.preventDefault()});
  d.querySelectorAll("img").forEach(i=>i.remove());return d.innerHTML}
function render(){const L=document.getElementById("list");L.innerHTML="";
 DATA.arts.forEach(a=>{const art=document.createElement("article");art.dataset.slug=a.slug;
  art.innerHTML=`<div class="head"><div><h2>${esc(a.title)}</h2><a href="${a.url}" target="_blank">${a.slug}</a>
   <div>${a.group.map(g=>`<span class="badge g-${g}">${GN[g]||g}</span>`).join("")}<span class="badge ${a.pri}">${a.pri}</span>
   <span class="badge">${a.clicks} clicks GSC</span><span class="badge">${a.items.length} block</span></div></div>
   <label class="complete"><input type="checkbox" data-art="${a.slug}"> Đã sửa xong bài này</label></div>`;
  a.items.forEach((it,k)=>{const id=a.slug+"#"+k;const c=document.createElement("div");c.className="chg";c.dataset.id=id;
   c.dataset.g=it.group.join(" ");c.dataset.p=it.pri;
   c.innerHTML=`<div class="chg-head"><div><b>${k+1}. ${esc(it.pos)}</b>
    <ul class="links">${it.links.map(l=>`<li><span class="badge g-${l.group}">${l.op}</span> ${l.op==="unlink"||l.op==="remove"||l.op==="cut"?`${l.op==="remove"?"xoá dòng":l.op==="cut"?"gỡ câu chứa link":"bỏ link"} <code>${l.to}</code>`:`→ <code>${l.to}</code> «${esc(l.anchor)}»`} <span class="why">— ${esc(l.why)}</span></li>`).join("")}</ul></div>
    <label class="complete"><input type="checkbox" data-id="${id}"> Xong</label></div>
    <div class="cols"><div><h3>Trước (tìm trong CMS) <button class="copy" data-t="b">Copy</button></h3><pre>${esc(it.before)}</pre></div>
    <div><h3>Sau (dán đè) <button class="copy" data-t="a">Copy</button></h3><pre>${it.after?esc(it.after):"(xoá cả block này)"}</pre></div></div>
    <h3 style="font-size:13px">Xem trước</h3><div class="preview">${preview(it.after,it)}</div>`;
   c.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.t==="a"?it.after:it.before);b.classList.add("ok");b.textContent="Đã copy";setTimeout(()=>{b.classList.remove("ok");b.textContent="Copy"},1200)});
   art.appendChild(c)});
  L.appendChild(art)});
 document.querySelectorAll("input[data-id]").forEach(x=>{x.checked=!!st[x.dataset.id];x.onchange=()=>{st[x.dataset.id]=x.checked;sync(x.closest("article"));save();apply()}});
 document.querySelectorAll("input[data-art]").forEach(x=>{x.onchange=()=>{x.closest("article").querySelectorAll("input[data-id]").forEach(y=>{y.checked=x.checked;st[y.dataset.id]=x.checked});save();apply()}});
 document.querySelectorAll("article").forEach(sync);apply()}
function sync(art){const ys=[...art.querySelectorAll("input[data-id]")];art.querySelector("input[data-art]").checked=ys.every(y=>y.checked)}
function apply(){const g=fG.value,p=document.getElementById("fP").value,q=document.getElementById("fQ").value.toLowerCase(),hide=document.getElementById("fD").value==="hide";
 let tot=0,dn=0;
 document.querySelectorAll("article").forEach(art=>{const a=DATA.arts.find(x=>x.slug===art.dataset.slug);let vis=0;
  art.querySelectorAll(".chg").forEach(c=>{const d=!!st[c.dataset.id];tot++;dn+=d;c.classList.toggle("done",d);
   const show=(g==="all"||c.dataset.g.split(" ").includes(g))&&(p==="all"||c.dataset.p===p)&&!(hide&&d);c.hidden=!show;vis+=show});
  const allDone=[...art.querySelectorAll(".chg")].every(c=>st[c.dataset.id]);art.classList.toggle("done",allDone);
  art.hidden=!vis||(q&&!(a.slug+" "+a.title).toLowerCase().includes(q))});
 document.getElementById("sum").textContent=`${dn}/${tot} block đã sửa · ${DATA.arts.length} bài`;document.getElementById("bar").style.width=(tot?100*dn/tot:0)+"%"}
["fG","fP","fQ","fD"].forEach(i=>document.getElementById(i).addEventListener("input",apply));
document.getElementById("exp").onclick=()=>{const s=DATA.arts.filter(a=>a.items.some((_,k)=>st[a.slug+"#"+k])).map(a=>a.slug);
 navigator.clipboard.writeText("python scripts/sync_live.py --only "+s.join(","));document.getElementById("exp").textContent="Đã copy lệnh sync ("+s.length+" bài)"};
render();
